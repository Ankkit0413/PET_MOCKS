<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSSSC PET CBT Simulator - सामान्य हिन्दी</title>
    <style>
        :root {
            --bg-main: #121316;
            --bg-card: #1e2024;
            --bg-hover: #2a2d35;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-correct: #22c55e;
            --color-correct-bg: rgba(34, 197, 94, 0.1);
            --color-incorrect: #ef4444;
            --color-incorrect-bg: rgba(239, 68, 68, 0.1);
            --color-unanswered: #f97316;
            --color-skipped: #64748b;
            --color-review: #a855f7;
            --color-not-visited: #334155;
            --border-color: #334155;
            --accent: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .subject-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .question-counter {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-badge {
            background-color: var(--bg-hover);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid var(--border-color);
        }

        .btn {
            background-color: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #3f4757;
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 30px 20px;
        }

        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .question-stem {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-item {
            background-color: var(--bg-main);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-item:hover:not(.locked) {
            border-color: var(--text-muted);
            background-color: var(--bg-hover);
        }

        .option-item.locked {
            cursor: default;
        }

        .option-item.correct {
            background-color: var(--color-correct-bg);
            border-color: var(--color-correct);
            color: var(--color-correct);
        }

        .option-item.incorrect {
            background-color: var(--color-incorrect-bg);
            border-color: var(--color-incorrect);
            color: var(--color-incorrect);
        }

        .option-item.reveal-correct {
            border-color: var(--color-correct);
            border-width: 2px;
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background-color: var(--bg-hover);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 25px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .explanation-box.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .expl-title {
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
            text-transform: uppercase;
        }
        
        .expl-fact {
            margin-top: 10px;
            background: rgba(59, 130, 246, 0.1);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Controls */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .controls-left {
            display: flex;
            gap: 10px;
        }

        /* Palette Drawer */
        .palette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .palette-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 380px;
            height: 100vh;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border-color);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        .palette-active .palette-overlay {
            opacity: 1;
            visibility: visible;
        }

        .palette-active .palette-drawer {
            right: 0;
        }

        .palette-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .palette-header h3 {
            margin: 0;
        }

        .palette-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .palette-btn {
            aspect-ratio: 1;
            border-radius: 6px;
            border: none;
            background-color: var(--color-not-visited);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: transform 0.1s;
        }

        .palette-btn:hover {
            transform: scale(1.05);
        }

        .palette-btn.current {
            border: 2px solid #fff;
            transform: scale(1.1);
        }

        /* Legend */
        .legend {
            font-size: 0.85rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        /* Status Colors */
        .s-correct { background-color: var(--color-correct) !important; }
        .s-incorrect { background-color: var(--color-incorrect) !important; }
        .s-unanswered { background-color: var(--color-unanswered) !important; }
        .s-skipped { background-color: var(--color-skipped) !important; }
        .s-review { background-color: var(--color-review) !important; }
        .s-notvisited { background-color: var(--color-not-visited) !important; }

        /* Report Dashboard */
        .report-dashboard {
            display: none;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }
        
        .report-dashboard h2 {
            margin-bottom: 20px;
            color: var(--accent);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-main);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .stat-val {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .controls-bar { flex-direction: column; align-items: stretch; }
            .controls-left { flex-direction: column; }
            .header-right { gap: 10px; }
            .btn { padding: 8px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-left">
            <div class="subject-title">सामान्य हिन्दी : लेखक और रचनाएँ</div>
            <div class="question-counter" id="q-counter">Question 1 of 100</div>
        </div>
        <div class="header-right">
            <div class="score-badge">Score: <span id="live-score">0.00</span></div>
            <button class="btn btn-primary" onclick="togglePalette()">📋 Open Palette</button>
        </div>
    </div>

    <div class="main-container" id="quiz-container">
        <div class="question-card">
            <div class="question-stem" id="q-stem">Loading Question...</div>
            <div class="options-list" id="options-container">
                <!-- Options injected here -->
            </div>
            
            <div class="explanation-box" id="expl-box">
                <div class="expl-title">व्याख्या / Explanation</div>
                <div id="expl-text"></div>
                <div class="expl-fact"><strong>Key Exam Fact:</strong> <span id="expl-fact-text"></span></div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="controls-left">
                <button class="btn" id="btn-skip" onclick="handleSkip()">Skip Question</button>
                <button class="btn" id="btn-review" onclick="handleReview()">Mark for Review</button>
            </div>
            <button class="btn btn-primary" id="btn-next" onclick="handleNext()">Next Question ➔</button>
            <button class="btn" style="background-color: var(--color-incorrect); color: white; display: none;" id="btn-finish" onclick="finishExam()">Submit Exam</button>
        </div>
    </div>

    <div class="main-container report-dashboard" id="report-container">
        <h2>Exam Completed</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="r-score">0.00</div>
                <div>Net Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="r-correct" style="color: var(--color-correct)">0</div>
                <div>Correct</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="r-incorrect" style="color: var(--color-incorrect)">0</div>
                <div>Incorrect</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="r-unattempted">0</div>
                <div>Unattempted</div>
            </div>
        </div>
        <button class="btn btn-primary" onclick="location.reload()">Restart Simulator</button>
    </div>

    <!-- Palette Drawer -->
    <div class="palette-overlay" onclick="togglePalette()"></div>
    <div class="palette-drawer">
        <div class="palette-header">
            <h3>Question Palette</h3>
            <button class="btn" onclick="togglePalette()">✕ Close</button>
        </div>
        <div class="palette-body">
            <div class="palette-grid" id="palette-grid">
                <!-- Buttons injected via JS -->
            </div>
            <div class="legend">
                <div class="legend-item"><div class="legend-color s-correct"></div> Correct (+1.0)</div>
                <div class="legend-item"><div class="legend-color s-incorrect"></div> Incorrect (-0.25)</div>
                <div class="legend-item"><div class="legend-color s-unanswered"></div> Unanswered</div>
                <div class="legend-item"><div class="legend-color s-skipped"></div> Skipped</div>
                <div class="legend-item"><div class="legend-color s-review"></div> Review</div>
                <div class="legend-item"><div class="legend-color s-notvisited"></div> Not Visited</div>
            </div>
        </div>
    </div>

    <script>
        // Data containing all 100 questions from the 4 batches
        const qData = [
            {q: "'गोदान' उपन्यास के लेखक कौन हैं?", opt: ["(A) जयशंकर प्रसाद", "(B) मुंशी प्रेमचंद", "(C) फणीश्वर नाथ रेणु", "(D) धर्मवीर भारती", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'गोदान' (1936) मुंशी प्रेमचंद द्वारा रचित अंतिम और सबसे प्रसिद्ध उपन्यास है, जो भारतीय किसान जीवन की महागाथा प्रस्तुत करता है।", fact: "प्रेमचंद को 'उपन्यास सम्राट' की उपाधि शरतचंद्र चट्टोपाध्याय ने दी थी।"},
            {q: "आधुनिक हिंदी साहित्य का महाकाव्य 'कामायनी' किसकी रचना है?", opt: ["(A) सुमित्रानंदन पंत", "(B) सूर्यकांत त्रिपाठी 'निराला'", "(C) जयशंकर प्रसाद", "(D) महादेवी वर्मा", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'कामायनी' (1936) छायावादी युग के प्रमुख स्तंभ जयशंकर प्रसाद का अंतिम और सर्वश्रेष्ठ महाकाव्य है। इसमें 15 सर्ग हैं, जिसका प्रारंभ 'चिंता' और अंत 'आनंद' सर्ग से होता है।", fact: "छायावाद के चार स्तंभों में जयशंकर प्रसाद प्रमुख माने जाते हैं।"},
            {q: "ज्ञानपीठ पुरस्कार से सम्मानित कृति 'यामा' की लेखिका कौन हैं?", opt: ["(A) सुभद्रा कुमारी चौहान", "(B) मन्नू भंडारी", "(C) कृष्णा सोबती", "(D) महादेवी वर्मा", "(E) इनमें से कोई नहीं"], ans: 3, expl: "'यामा' महादेवी वर्मा का एक कविता संग्रह है। इस कृति के लिए उन्हें 1982 में हिंदी साहित्य का सर्वोच्च सम्मान 'ज्ञानपीठ पुरस्कार' प्रदान किया गया था।", fact: "महादेवी वर्मा को 'आधुनिक मीरा' के नाम से भी जाना जाता है।"},
            {q: "'रामचरितमानस' किस भाषा में रचित है?", opt: ["(A) ब्रज भाषा", "(B) अवधी", "(C) खड़ी बोली", "(D) मैथिली", "(E) इनमें से कोई नहीं"], ans: 1, expl: "गोस्वामी तुलसीदास जी द्वारा रचित 'रामचरितमानस' अवधी भाषा का एक अनुपम महाकाव्य है, जिसे सात कांडों में विभाजित किया गया है।", fact: "रामचरितमानस का सबसे बड़ा कांड 'बालकांड' और सबसे छोटा कांड 'किष्किंधा कांड' है।"},
            {q: "'बीजक' किस कवि की रचनाओं का संग्रह है?", opt: ["(A) सूरदास", "(B) कबीरदास", "(C) तुलसीदास", "(D) रहीम", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'बीजक' संत कबीरदास की प्रामाणिक रचनाओं का संग्रह है। इसके तीन मुख्य भाग हैं— साखी, सबद और रमैनी। इसका संकलन उनके शिष्य धर्मदास ने किया था।", fact: "कबीर की भाषा को आचार्य रामचंद्र शुक्ल ने 'सधुक्कड़ी' और श्यामसुंदर दास ने 'पंचमेल खिचड़ी' कहा है।"},
            {q: "'उर्वशी' महाकाव्य के रचयिता कौन हैं, जिन्हें इसके लिए ज्ञानपीठ पुरस्कार मिला?", opt: ["(A) रामधारी सिंह 'दिनकर'", "(B) मैथिलीशरण गुप्त", "(C) सोहनलाल द्विवेदी", "(D) माखनलाल चतुर्वेदी", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'उर्वशी' रामधारी सिंह 'दिनकर' द्वारा रचित एक काव्य-नाटक (गीतिनाट्य) है। दिनकर जी को इस उत्कृष्ट रचना के लिए 1972 में ज्ञानपीठ पुरस्कार से सम्मानित किया गया था।", fact: "दिनकर जी को 'राष्ट्रकवि' और 'अनलता का कवि' (कवि-ओज) भी कहा जाता है।"},
            {q: "'साकेत' महाकाव्य के रचयिता कौन हैं?", opt: ["(A) अयोध्यासिंह उपाध्याय 'हरिऔध'", "(B) मैथिलीशरण गुप्त", "(C) रामनरेश त्रिपाठी", "(D) भवानी प्रसाद मिश्र", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'साकेत' राष्ट्रकवि मैथिलीशरण गुप्त का प्रसिद्ध महाकाव्य है। यह रामकथा पर आधारित है, जिसमें मुख्य रूप से उर्मिला (लक्ष्मण की पत्नी) की विरह-व्यथा का चित्रण किया गया है।", fact: "महात्मा गांधी ने मैथिलीशरण गुप्त को 'राष्ट्रकवि' की उपाधि दी थी।"},
            {q: "'अंधेर नगरी' नाटक के लेखक कौन हैं?", opt: ["(A) जयशंकर प्रसाद", "(B) मुंशी प्रेमचंद", "(C) भारतेन्दु हरिश्चंद्र", "(D) मोहन राकेश", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'अंधेर नगरी' (1881) भारतेन्दु हरिश्चंद्र द्वारा लिखा गया एक प्रसिद्ध प्रहसन (नाटक) है, जिसमें तत्कालीन भ्रष्ट शासन व्यवस्था पर तीखा व्यंग्य किया गया है।", fact: "भारतेन्दु हरिश्चंद्र को 'आधुनिक हिंदी साहित्य का पितामह' कहा जाता है।"},
            {q: "हिंदी का पहला आंचलिक उपन्यास 'मैला आँचल' किसने लिखा है?", opt: ["(A) यशपाल", "(B) अज्ञेय", "(C) फणीश्वर नाथ 'रेणु'", "(D) रांगेय राघव", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'मैला आँचल' (1954) फणीश्वर नाथ 'रेणु' का सर्वश्रेष्ठ उपन्यास है। इसे हिंदी साहित्य का प्रथम और सबसे सफल आंचलिक उपन्यास माना जाता है, जिसमें पूर्णिया जिले के मेरीगंज गाँव की कथा है।", fact: "आंचलिक उपन्यासों में किसी विशेष क्षेत्र या अंचल की भाषा, रहन-सहन और संस्कृति को केंद्र में रखा जाता है।"},
            {q: "'अंधा युग' नामक चर्चित गीतिनाट्य के लेखक कौन हैं?", opt: ["(A) धर्मवीर भारती", "(B) सर्वेश्वर दयाल सक्सेना", "(C) दुष्यंत कुमार", "(D) नरेश मेहता", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'अंधा युग' (1954) धर्मवीर भारती का एक प्रसिद्ध गीतिनाट्य है। इसकी कथावस्तु महाभारत युद्ध के अंतिम दिन से लेकर कृष्ण की मृत्यु तक पर आधारित है।", fact: "धर्मवीर भारती प्रसिद्ध पत्रिका 'धर्मयुग' के संपादक भी रहे हैं।"},
            {q: "'बाणभट्ट की आत्मकथा' किस विधा की रचना है और इसके लेखक कौन हैं?", opt: ["(A) कहानी - प्रेमचंद", "(B) उपन्यास - हजारीप्रसाद द्विवेदी", "(C) आत्मकथा - बाणभट्ट", "(D) नाटक - जयशंकर प्रसाद", "(E) इनमें से कोई नहीं"], ans: 1, expl: "नाम के विपरीत, 'बाणभट्ट की आत्मकथा' कोई आत्मकथा नहीं, बल्कि आचार्य हजारीप्रसाद द्विवेदी द्वारा रचित एक उत्कृष्ट ऐतिहासिक उपन्यास है।", fact: "हजारीप्रसाद द्विवेदी के अन्य प्रसिद्ध उपन्यास 'पुनर्नवा' और 'चारुचंद्रलेख' हैं।"},
            {q: "'राम की शक्ति पूजा' नामक प्रसिद्ध लंबी कविता के रचयिता कौन हैं?", opt: ["(A) सुमित्रानंदन पंत", "(B) जयशंकर प्रसाद", "(C) सूर्यकांत त्रिपाठी 'निराला'", "(D) महादेवी वर्मा", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'राम की शक्ति पूजा' (1936) महाकवि सूर्यकांत त्रिपाठी 'निराला' की एक ओजस्वी और प्रसिद्ध लंबी कविता है। इसमें राम-रावण युद्ध के दौरान राम की मानसिक स्थिति और शक्ति-आराधना का वर्णन है।", fact: "निराला जी को हिंदी साहित्य में 'मुक्तक छंद' का प्रवर्तक माना जाता है।"},
            {q: "'चिदंबरा' के लिए किस कवि को प्रथम हिंदी ज्ञानपीठ पुरस्कार प्राप्त हुआ था?", opt: ["(A) सुमित्रानंदन पंत", "(B) रामधारी सिंह दिनकर", "(C) अज्ञेय", "(D) महादेवी वर्मा", "(E) इनमें से कोई नहीं"], ans: 0, expl: "सुमित्रानंदन पंत को उनकी काव्य कृति 'चिदंबरा' के लिए 1968 में हिंदी साहित्य का पहला ज्ञानपीठ पुरस्कार प्रदान किया गया था।", fact: "सुमित्रानंदन पंत को प्रकृति का सुकुमार कवि कहा जाता है।"},
            {q: "'पुष्प की अभिलाषा' कविता के लेखक कौन हैं?", opt: ["(A) रामनरेश त्रिपाठी", "(B) माखनलाल चतुर्वेदी", "(C) सुभद्रा कुमारी चौहान", "(D) बालकृष्ण शर्मा 'नवीन'", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'पुष्प की अभिलाषा' माखनलाल चतुर्वेदी की एक अत्यंत लोकप्रिय राष्ट्रीय भावना से ओत-प्रोत कविता है।", fact: "माखनलाल चतुर्वेदी को 'एक भारतीय आत्मा' के उपनाम से जाना जाता है और उन्हें 'हिमतरंगिणी' के लिए पहला साहित्य अकादमी पुरस्कार मिला था।"},
            {q: "'मधुशाला' (1935) के रचनाकार कौन हैं?", opt: ["(A) हरिवंश राय बच्चन", "(B) भगवती चरण वर्मा", "(C) रामधारी सिंह दिनकर", "(D) शिवमंगल सिंह 'सुमन'", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'मधुशाला' हिंदी के प्रसिद्ध कवि हरिवंश राय बच्चन का सबसे लोकप्रिय काव्य संग्रह है। यह उमर खय्याम की रुबाइयों से प्रेरित है।", fact: "हरिवंश राय बच्चन हिंदी साहित्य में 'हालावाद' के प्रवर्तक माने जाते हैं।"},
            {q: "विभाजन की त्रासदी पर आधारित उपन्यास 'झूठा सच' के लेखक कौन हैं?", opt: ["(A) रांगेय राघव", "(B) भीष्म साहनी", "(C) यशपाल", "(D) कमलेश्वर", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'झूठा सच' (दो भागों में: वतन और देश, देश का भविष्य) मार्क्सवादी विचारक और कथाकार यशपाल का सबसे प्रसिद्ध उपन्यास है, जो भारत-पाक विभाजन की त्रासदी पर केंद्रित है।", fact: "यशपाल प्रगतिवादी धारा के प्रमुख कहानीकार और उपन्यासकार हैं; 'दिव्या' उनका अन्य प्रसिद्ध उपन्यास है।"},
            {q: "'कितनी नावों में कितनी बार' रचना के लिए किसे ज्ञानपीठ पुरस्कार मिला?", opt: ["(A) सच्चिदानंद हीरानंद वात्स्यायन 'अज्ञेय'", "(B) नरेश मेहता", "(C) कुंवर नारायण", "(D) केदारनाथ सिंह", "(E) इनमें से कोई नहीं"], ans: 0, expl: "प्रयोगवाद के जनक अज्ञेय जी को उनके काव्य संग्रह 'कितनी नावों में कितनी बार' के लिए 1978 में ज्ञानपीठ पुरस्कार से सम्मानित किया गया था।", fact: "अज्ञेय जी ने 'तार सप्तक' (1943) का संपादन किया था, जिससे हिंदी में प्रयोगवाद की शुरुआत मानी जाती है।"},
            {q: "हिंदी के प्रथम तिलिस्मी और ऐयारी उपन्यास 'चंद्रकांता' के लेखक कौन हैं?", opt: ["(A) किशोरीलाल गोस्वामी", "(B) बालकृष्ण भट्ट", "(C) देवकीनंदन खत्री", "(D) गोपालराम गहमरी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'चंद्रकांता' (1888) बाबू देवकीनंदन खत्री का प्रसिद्ध तिलिस्मी उपन्यास है। कहा जाता है कि इस उपन्यास को पढ़ने के लिए लाखों अहिंदी भाषियों ने हिंदी सीखी।", fact: "देवकीनंदन खत्री को हिंदी में तिलिस्मी और जासूसी उपन्यासों का जन्मदाता माना जाता है।"},
            {q: "'पद्मावत' किस भाषा में लिखा गया महाकाव्य है?", opt: ["(A) ब्रज भाषा", "(B) खड़ी बोली", "(C) अवधी", "(D) राजस्थानी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'पद्मावत' (1540 ई.) सूफी कवि मलिक मोहम्मद जायसी द्वारा ठेठ अवधी भाषा में लिखा गया एक प्रेमाख्यानक महाकाव्य है।", fact: "जायसी निर्गुण भक्ति धारा की प्रेमाश्रयी शाखा (सूफी काव्य धारा) के प्रमुख कवि हैं।"},
            {q: "'खड़ी बोली' हिंदी का प्रथम महाकाव्य किसे माना जाता है?", opt: ["(A) साकेत", "(B) कामायनी", "(C) प्रियप्रवास", "(D) लोकायतन", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'प्रियप्रवास' (1914) को खड़ी बोली हिंदी का प्रथम महाकाव्य माना जाता है। इसके रचयिता अयोध्यासिंह उपाध्याय 'हरिऔध' हैं।", fact: "हरिऔध जी को 'कवि सम्राट' की उपाधि प्राप्त है।"},
            {q: "'आषाढ़ का एक दिन' नाटक के रचयिता कौन हैं?", opt: ["(A) मोहन राकेश", "(B) लक्ष्मीनारायण लाल", "(C) सुरेन्द्र वर्मा", "(D) जगदीश चंद्र माथुर", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'आषाढ़ का एक दिन' (1958) मोहन राकेश का प्रसिद्ध नाटक है, जो महाकवि कालिदास के जीवन पर आधारित है। इसे आधुनिक हिंदी नाटक का मील का पत्थर माना जाता है।", fact: "मोहन राकेश के अन्य प्रसिद्ध नाटक 'लहरों के राजहंस' और 'आधे अधूरे' हैं।"},
            {q: "'तमस' उपन्यास के लेखक कौन हैं, जिस पर प्रसिद्ध दूरदर्शन धारावाहिक भी बना?", opt: ["(A) निर्मल वर्मा", "(B) कृष्णा सोबती", "(C) भीष्म साहनी", "(D) मन्नू भंडारी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'तमस' (1973) भीष्म साहनी का एक यथार्थवादी उपन्यास है, जो भारत विभाजन के समय हुए सांप्रदायिक दंगों की पृष्ठभूमि पर आधारित है। इसे 1975 में साहित्य अकादमी पुरस्कार मिला।", fact: "भीष्म साहनी प्रसिद्ध अभिनेता बलराज साहनी के छोटे भाई थे।"},
            {q: "'मृगनयनी' किस प्रकार का उपन्यास है और इसके लेखक कौन हैं?", opt: ["(A) सामाजिक - प्रेमचंद", "(B) ऐतिहासिक - वृंदावनलाल वर्मा", "(C) मनोवैज्ञानिक - जैनेंद्र", "(D) आंचलिक - फणीश्वरनाथ रेणु", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'मृगनयनी' वृंदावनलाल वर्मा द्वारा रचित एक प्रसिद्ध ऐतिहासिक उपन्यास है। इसमें ग्वालियर के राजा मानसिंह तोमर और उनकी गुर्जर रानी मृगनयनी की प्रेम कथा है।", fact: "वृंदावनलाल वर्मा को हिंदी का 'वाल्टर स्कॉट' (Walter Scott) कहा जाता है क्योंकि वे ऐतिहासिक उपन्यास लेखन में पारंगत थे।"},
            {q: "'अतीत के चलचित्र' और 'स्मृति की रेखाएं' किस विधा की रचनाएँ हैं?", opt: ["(A) रेखाचित्र / संस्मरण", "(B) कहानी", "(C) उपन्यास", "(D) नाटक", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'अतीत के चलचित्र' और 'स्मृति की रेखाएं' महादेवी वर्मा के प्रसिद्ध रेखाचित्र एवं संस्मरण संग्रह हैं, जिनमें उन्होंने समाज के शोषित और उपेक्षित वर्ग का मार्मिक चित्रण किया है।", fact: "महादेवी वर्मा की रचना 'गिल्लू' (गिलहरी पर आधारित) संस्मरण साहित्य का उत्कृष्ट उदाहरण है।"},
            {q: "'आवारा मसीहा' किसकी जीवनी है और इसके लेखक कौन हैं?", opt: ["(A) शरतचंद्र की जीवनी - विष्णु प्रभाकर", "(B) प्रेमचंद की जीवनी - अमृतराय", "(C) निराला की जीवनी - रामविलास शर्मा", "(D) अज्ञेय की जीवनी - रामकमल राय", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'आवारा मसीहा' प्रसिद्ध बांग्ला लेखक शरतचंद्र चट्टोपाध्याय के जीवन पर आधारित एक उत्कृष्ट जीवनी है, जिसे विष्णु प्रभाकर ने लिखा है।", fact: "प्रेमचंद की प्रसिद्ध जीवनी 'कलम का सिपाही' उनके पुत्र अमृतराय ने लिखी है।"},
            {q: "प्रसिद्ध रोमांटिक उपन्यास 'गुनाहों का देवता' के लेखक कौन हैं?", opt: ["(A) कमलेश्वर", "(B) धर्मवीर भारती", "(C) फणीश्वर नाथ रेणु", "(D) मनोहर श्याम जोशी", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'गुनाहों का देवता' (1949) धर्मवीर भारती का एक अत्यंत लोकप्रिय उपन्यास है, जिसमें चंदर और सुधा की भावुक और त्रासद प्रेम कहानी का वर्णन किया गया है।", fact: "धर्मवीर भारती की अन्य प्रसिद्ध रचना 'सूरज का सातवाँ घोड़ा' है, जिस पर फिल्म भी बन चुकी है।"},
            {q: "'सूरसागर' की रचना किस भाषा में की गई है?", opt: ["(A) अवधी", "(B) खड़ी बोली", "(C) ब्रज भाषा", "(D) मैथिली", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'सूरसागर' कृष्णभक्ति शाखा के प्रमुख कवि सूरदास की प्रामाणिक रचना है। इसमें भगवान कृष्ण की बाल-लीलाओं का मनोहर वर्णन ब्रज भाषा में किया गया है।", fact: "सूरदास को 'वात्सल्य रस का सम्राट' और 'अष्टछाप का जहाज़' कहा जाता है।"},
            {q: "'चाँद का मुँह टेढ़ा है' काव्य-संग्रह के रचयिता कौन हैं?", opt: ["(A) भवानी प्रसाद मिश्र", "(B) गजानन माधव 'मुक्तिबोध'", "(C) नागार्जुन", "(D) त्रिलोचन", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'चाँद का मुँह टेढ़ा है' (1964) प्रयोगवादी और नई कविता के प्रमुख हस्ताक्षर गजानन माधव 'मुक्तिबोध' का प्रसिद्ध काव्य-संग्रह है, जिसमें उनकी फैंटेसी (fantasy) शैली का प्रयोग दिखता है।", fact: "मुक्तिबोध की प्रसिद्ध लंबी कविता 'अंधेरे में' इसी संग्रह में संकलित है।"},
            {q: "मनोवैज्ञानिक उपन्यास 'त्यागपत्र' के लेखक कौन हैं?", opt: ["(A) अज्ञेय", "(B) इलाचंद्र जोशी", "(C) जैनेंद्र कुमार", "(D) यशपाल", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'त्यागपत्र' (1937) जैनेंद्र कुमार का एक प्रसिद्ध मनोवैज्ञानिक उपन्यास है, जिसमें मृणाल नाम की स्त्री के जीवन संघर्ष और समाज के नैतिक दोहरेपन का चित्रण है।", fact: "जैनेंद्र कुमार को हिंदी में 'मनोविश्लेषणवादी' उपन्यास का जनक माना जाता है।"},
            {q: "हिंदी साहित्य का प्रथम महाकाव्य किसे माना जाता है?", opt: ["(A) रामचरितमानस", "(B) पद्मावत", "(C) पृथ्वीराज रासो", "(D) बीसलदेव रासो", "(E) इनमें से कोई नहीं"], ans: 2, expl: "आचार्य रामचंद्र शुक्ल के अनुसार, चंदबरदाई द्वारा रचित 'पृथ्वीराज रासो' हिंदी साहित्य का प्रथम महाकाव्य है। इसमें पृथ्वीराज चौहान की वीरता और प्रेम का वर्णन है।", fact: "चंदबरदाई को हिंदी का प्रथम महाकवि माना जाता है। वे पृथ्वीराज चौहान के दरबारी कवि और मित्र थे।"},
            {q: "कर्ण के जीवन पर आधारित खंडकाव्य 'रश्मिरथी' के रचयिता कौन हैं?", opt: ["(A) रामधारी सिंह दिनकर", "(B) मैथिलीशरण गुप्त", "(C) श्याम नारायण पांडेय", "(D) रामनरेश त्रिपाठी", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'रश्मिरथी' (1952) रामधारी सिंह दिनकर द्वारा रचित एक अत्यंत ओजस्वी खंडकाव्य है। इसमें महाभारत के पात्र कर्ण के चरित्र, संघर्ष और दानवीरता का शानदार चित्रण है।", fact: "रश्मिरथी का अर्थ है— 'वह व्यक्ति जिसका रथ रश्मि (सूर्य की किरणों) का हो'।"},
            {q: "'आधे अधूरे' नाटक के रचयिता कौन हैं?", opt: ["(A) जगदीश चंद्र माथुर", "(B) मोहन राकेश", "(C) भारतेन्दु हरिश्चंद्र", "(D) लक्ष्मीनारायण मिश्र", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'आधे अधूरे' (1969) मोहन राकेश का बहुचर्चित नाटक है, जो मध्यमवर्गीय परिवार की विसंगतियों और टूटते पारिवारिक रिश्तों का यथार्थवादी चित्रण करता है।", fact: "इस नाटक को 'आधुनिक हिंदी नाटक का मील का पत्थर' माना जाता है।"},
            {q: "शिवपालगंज गाँव की पृष्ठभूमि पर लिखा गया व्यंग्यात्मक उपन्यास 'राग दरबारी' किसका है?", opt: ["(A) हरिशंकर परसाई", "(B) शरद जोशी", "(C) श्रीलाल शुक्ल", "(D) कमलेश्वर", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'राग दरबारी' (1968) श्रीलाल शुक्ल का एक उत्कृष्ट व्यंग्यात्मक उपन्यास है, जिसके लिए उन्हें 1969 में साहित्य अकादमी पुरस्कार मिला था। यह शिवपालगंज गाँव के माध्यम से भारतीय व्यवस्था पर तीखा प्रहार करता है।", fact: "वैद्यजी, रंगनाथ और रुप्पन बाबू इस उपन्यास के प्रमुख पात्र हैं।"},
            {q: "किस रचना ने मैथिलीशरण गुप्त को 'राष्ट्रकवि' के रूप में प्रतिष्ठित किया?", opt: ["(A) यशोधरा", "(B) जयद्रथ वध", "(C) भारत-भारती", "(D) पंचवटी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'भारत-भारती' (1912) मैथिलीशरण गुप्त की वह प्रसिद्ध काव्य-कृति है जिसने स्वतंत्रता संग्राम के दौरान भारतीयों में राष्ट्रीय चेतना जगाई और इसी के कारण गांधी जी ने उन्हें 'राष्ट्रकवि' कहा।", fact: "भारत-भारती में भारत के अतीत (गौरव), वर्तमान (दुर्दशा) और भविष्य (आशा) का वर्णन है।"},
            {q: "'शेखर: एक जीवनी' किस विधा की रचना है?", opt: ["(A) आत्मकथा", "(B) जीवनी", "(C) उपन्यास", "(D) रेखाचित्र", "(E) इनमें से कोई नहीं"], ans: 2, expl: "नाम में 'जीवनी' होने के बावजूद 'शेखर: एक जीवनी' सच्चिदानंद हीरानंद वात्स्यायन 'अज्ञेय' का एक श्रेष्ठ मनोवैज्ञानिक उपन्यास है।", fact: "यह उपन्यास फ्लैशबैक (पूर्वदीप्ति) शैली में लिखा गया हिंदी का एक महत्वपूर्ण उपन्यास है।"},
            {q: "'संस्कृति के चार अध्याय' के लेखक कौन हैं?", opt: ["(A) हजारी प्रसाद द्विवेदी", "(B) रामधारी सिंह दिनकर", "(C) वासुदेव शरण अग्रवाल", "(D) रामवृक्ष बेनीपुरी", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'संस्कृति के चार अध्याय' रामधारी सिंह दिनकर का एक प्रसिद्ध गद्य ग्रंथ (निबंध संग्रह/सांस्कृतिक इतिहास) है। इस रचना के लिए उन्हें 1959 में साहित्य अकादमी पुरस्कार से सम्मानित किया गया था।", fact: "इस पुस्तक की प्रस्तावना भारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू ने लिखी थी।"},
            {q: "'संसद से सड़क तक' काव्य संग्रह के रचयिता कौन हैं?", opt: ["(A) नागार्जुन", "(B) सुदामा पांडेय 'धूमिल'", "(C) केदारनाथ अग्रवाल", "(D) भवानी प्रसाद मिश्र", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'संसद से सड़क तक' (1972) साठोत्तरी हिंदी कविता के प्रमुख कवि सुदामा पांडेय 'धूमिल' का चर्चित काव्य संग्रह है, जिसमें राजनीतिक और सामाजिक विसंगतियों पर कड़ा प्रहार किया गया है।", fact: "धूमिल को मरणोपरांत उनके काव्य संग्रह 'कल सुनना मुझे' के लिए साहित्य अकादमी पुरस्कार मिला था।"},
            {q: "तलाकशुदा माता-पिता के बच्चे की मानसिकता पर आधारित उपन्यास 'आपका बंटी' किसने लिखा है?", opt: ["(A) कृष्णा सोबती", "(B) मन्नू भंडारी", "(C) उषा प्रियंवदा", "(D) मृदुला गर्ग", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'आपका बंटी' (1971) मन्नू भंडारी का एक अत्यंत संवेदनशील उपन्यास है, जिसमें माता-पिता के तलाक के बाद बच्चे (बंटी) के मनोविज्ञान और उसकी असुरक्षा की भावना का सूक्ष्म चित्रण है।", fact: "मन्नू भंडारी का एक अन्य प्रसिद्ध उपन्यास 'महाभोज' है, जो राजनीतिक भ्रष्टाचार पर केंद्रित है।"},
            {q: "'अनामदास का पोथा' उपन्यास के लेखक कौन हैं?", opt: ["(A) हजारी प्रसाद द्विवेदी", "(B) विद्यानिवास मिश्र", "(C) कुबेरनाथ राय", "(D) डॉ. संपूर्णानंद", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'अनामदास का पोथा' (1976) आचार्य हजारी प्रसाद द्विवेदी का अंतिम उपन्यास है, जो छान्दोग्य और बृहदारण्यक उपनिषदों की कथा पर आधारित है।", fact: "इस उपन्यास में रैक्व मुनि और जाबाला की कथा के माध्यम से ज्ञान और कर्म का समन्वय दिखाया गया है।"},
            {q: "महात्मा गांधी के जीवन पर आधारित महाकाव्य 'लोकायतन' के रचयिता कौन हैं?", opt: ["(A) भवानी प्रसाद मिश्र", "(B) सोहनलाल द्विवेदी", "(C) सुमित्रानंदन पंत", "(D) रामनरेश त्रिपाठी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'लोकायतन' (1964) प्रकृति के सुकुमार कवि सुमित्रानंदन पंत द्वारा रचित एक विशाल महाकाव्य है, जो महात्मा गांधी के जीवन और दर्शन पर आधारित है।", fact: "इस महाकाव्य के लिए पंत जी को सोवियत लैंड नेहरू पुरस्कार प्राप्त हुआ था।"},
            {q: "वीर रस प्रधान रचना 'परमाल रासो' (आल्हाखंड) के रचयिता कौन हैं?", opt: ["(A) चंदबरदाई", "(B) जगनिक", "(C) नरपति नाल्ह", "(D) दलपति विजय", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'परमाल रासो' आदि काल के कवि जगनिक द्वारा रचित एक वीरगाथात्मक काव्य है। इसी का एक भाग 'आल्हाखंड' के नाम से प्रसिद्ध है, जिसमें महोबा के वीर आल्हा और ऊदल की वीरता का वर्णन है।", fact: "आल्हाखंड उत्तर प्रदेश और मध्य प्रदेश के बुंदेलखंड क्षेत्र में बरसात (वर्षा ऋतु) के दिनों में विशेष रूप से गाया जाता है।"},
            {q: "'वीरों का कैसा हो वसंत' नामक वीर रस से पूर्ण कविता की लेखिका कौन हैं?", opt: ["(A) महादेवी वर्मा", "(B) सुभद्रा कुमारी चौहान", "(C) मीराबाई", "(D) सरोजिनी नायडू", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'वीरों का कैसा हो वसंत' सुभद्रा कुमारी चौहान की एक प्रसिद्ध कविता है। उनकी कविताओं में राष्ट्रीयता और वीर रस की प्रधानता रही है।", fact: "'झाँसी की रानी' (बुंदेले हरबोलों के मुँह...) भी सुभद्रा कुमारी चौहान की सर्वाधिक प्रसिद्ध कविता है।"},
            {q: "बाबा भारती और डाकू खड़गसिंह की प्रसिद्ध कहानी 'हार की जीत' के लेखक कौन हैं?", opt: ["(A) मुंशी प्रेमचंद", "(B) जयशंकर प्रसाद", "(C) सुदर्शन", "(D) विश्वंभरनाथ शर्मा 'कौशिक'", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'हार की जीत' सुदर्शन (बद्रीनाथ भट्ट) द्वारा रचित एक अत्यंत आदर्शवादी और प्रसिद्ध कहानी है, जिसमें बाबा भारती के त्याग से डाकू खड़गसिंह का हृदय परिवर्तन हो जाता है।", fact: "इस कहानी का मुख्य संदेश बुराई पर अच्छाई और सत्य की जीत है।"},
            {q: "मध्यवर्गीय अवसरवादिता पर चोट करने वाली कहानी 'चीफ़ की दावत' किसने लिखी है?", opt: ["(A) भीष्म साहनी", "(B) कमलेश्वर", "(C) राजेंद्र यादव", "(D) मोहन राकेश", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'चीफ़ की दावत' भीष्म साहनी की एक मार्मिक कहानी है। इसमें शामनाथ नाम के पात्र के माध्यम से यह दिखाया गया है कि कैसे एक व्यक्ति अपने बॉस को खुश करने के लिए अपनी बूढ़ी माँ को ही बोझ समझने लगता है।", fact: "यह कहानी नई कहानी आंदोलन की महत्वपूर्ण कहानियों में गिनी जाती है।"},
            {q: "'बुनी हुई रस्सी' काव्य संग्रह के लिए किसे साहित्य अकादमी पुरस्कार प्राप्त हुआ था?", opt: ["(A) भवानी प्रसाद मिश्र", "(B) दुष्यंत कुमार", "(C) केदारनाथ सिंह", "(D) सर्वेश्वर दयाल सक्सेना", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'बुनी हुई रस्सी' गांधीवादी विचारक और सहजता के कवि भवानी प्रसाद मिश्र का प्रसिद्ध काव्य संग्रह है, जिसके लिए उन्हें 1972 में साहित्य अकादमी पुरस्कार मिला।", fact: "भवानी प्रसाद मिश्र को 'कविता का गांधी' भी कहा जाता है। 'गीत फरोश' इनकी अन्य प्रसिद्ध रचना है।"},
            {q: "'तितली' और 'इरावती' (अपूर्ण) उपन्यासों के लेखक कौन हैं?", opt: ["(A) जयशंकर प्रसाद", "(B) प्रेमचंद", "(C) चतुरसेन शास्त्री", "(D) वृंदावनलाल वर्मा", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'तितली' और 'इरावती' जयशंकर प्रसाद के उपन्यास हैं। जहाँ तितली एक ग्रामीण यथार्थवादी उपन्यास है, वहीं इरावती एक ऐतिहासिक उपन्यास है जो प्रसाद जी के निधन के कारण अपूर्ण रह गया।", fact: "प्रसाद जी का पहला उपन्यास 'कंकाल' है।"},
            {q: "आचार्य रामचंद्र शुक्ल का प्रसिद्ध निबंध संग्रह कौन सा है?", opt: ["(A) अशोक के फूल", "(B) चिंतामणि", "(C) कुटज", "(D) रस आखेटक", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'चिंतामणि' (चार भागों में) आचार्य रामचंद्र शुक्ल का सर्वश्रेष्ठ निबंध संग्रह है। इसमें मनोविकार और साहित्य समीक्षा से संबंधित उच्च कोटि के निबंध संकलित हैं।", fact: "चिंतामणि का पहला भाग पहले 'विचार-वीथी' के नाम से प्रकाशित हुआ था।"},
            {q: "'अशोक के फूल' नामक निबंध संग्रह के लेखक कौन हैं?", opt: ["(A) विद्यानिवास मिश्र", "(B) हरिशंकर परसाई", "(C) हजारी प्रसाद द्विवेदी", "(D) रामचंद्र शुक्ल", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'अशोक के फूल' आचार्य हजारी प्रसाद द्विवेदी का प्रसिद्ध ललित निबंध संग्रह है। इसमें उन्होंने भारतीय संस्कृति और इतिहास की व्यापक समीक्षा回की है।", fact: "हजारी प्रसाद द्विवेदी हिंदी साहित्य में 'ललित निबंध' परंपरा के सर्वश्रेष्ठ लेखक माने जाते हैं; 'कुटज' उनका अन्य प्रसिद्ध निबंध है।"},
            {q: "गोस्वामी तुलसीदास के जीवन पर आधारित उपन्यास 'मानस का हंस' किसने लिखा है?", opt: ["(A) अमृतलाल नागर", "(B) रांगेय राघव", "(C) भगवती चरण वर्मा", "(D) यशपाल", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'मानस का हंस' (1972) अमृतलाल नागर द्वारा लिखा गया एक श्रेष्ठ जीवनीपरक उपन्यास है, जो रामचरितमानस के रचयिता गोस्वामी तुलसीदास के जीवन और युग पर आधारित है।", fact: "अमृतलाल नागर का एक अन्य प्रसिद्ध उपन्यास 'खंजन नयन' है, जो सूरदास के जीवन पर आधारित है।"},
            {q: "मुंशी प्रेमचंद की जीवनी 'कलम का सिपाही' के लेखक कौन हैं?", opt: ["(A) रामविलास शर्मा", "(B) अमृतराय", "(C) मदन गोपाल", "(D) शिवरानी देवी", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'कलम का सिपाही' मुंशी प्रेमचंद की प्रामाणिक जीवनी है, जिसे उनके पुत्र अमृतराय ने लिखा है। इसके लिए उन्हें 1963 में साहित्य अकादमी पुरस्कार मिला था।", fact: "प्रेमचंद की पत्नी शिवरानी देवी ने भी उन पर एक संस्मरण/जीवनी लिखी है, जिसका नाम 'प्रेमचंद घर में' है।"},
            {q: "पाप और पुण्य के नैतिक द्वंद्व पर आधारित प्रसिद्ध उपन्यास 'चित्रलेखा' के लेखक कौन हैं?", opt: ["(A) जैनेंद्र कुमार", "(B) भगवती चरण वर्मा", "(C) यशपाल", "(D) अमृतलाल नागर", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'चित्रलेखा' (1934) भगवती चरण वर्मा का सबसे प्रसिद्ध उपन्यास है। इस उपन्यास में यह दर्शाया गया है कि पाप और पुण्य केवल मनुष्य के दृष्टिकोण पर निर्भर करते हैं।", fact: "इस उपन्यास पर दो बार हिंदी फ़िल्मों का निर्माण हो चुका है।"},
            {q: "'माटी की मूरतें' नामक प्रसिद्ध रेखाचित्र के रचयिता कौन हैं?", opt: ["(A) रामवृक्ष बेनीपुरी", "(B) महादेवी वर्मा", "(C) कन्हैयालाल मिश्र 'प्रभाकर'", "(D) बनारसीदास चतुर्वेदी", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'माटी की मूरतें' रामवृक्ष बेनीपुरी का अत्यंत प्रसिद्ध रेखाचित्र/संस्मरण संग्रह है, जिसमें उन्होंने ग्रामीण जीवन के साधारण लोगों के असाधारण चरित्रों को उकेरा है।", fact: "रामवृक्ष बेनीपुरी को 'कलम का जादूगर' कहा जाता है। 'गेहूँ और गुलाब' इनकी अन्य प्रसिद्ध रचना है।"},
            {q: "'दीपशिखा' और 'नीरजा' किस प्रसिद्ध कवयित्री के काव्य-संग्रह हैं?", opt: ["(A) सुभद्रा कुमारी चौहान", "(B) मीराबाई", "(C) महादेवी वर्मा", "(D) सरोजिनी नायडू", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'दीपशिखा' और 'नीरजा' छायावादी युग की प्रमुख स्तंभ महादेवी वर्मा के प्रसिद्ध काव्य-संग्रह हैं। उनके काव्यों में रहस्यवाद और विरह की वेदना गहराई से झलकती है।", fact: "महादेवी वर्मा को उनकी रचना 'नीरजा' के लिए सेकसरिया पुरस्कार प्राप्त हुआ था।"},
            {q: "गौतम बुद्ध की पत्नी के त्याग और पीड़ा पर आधारित खंडकाव्य 'यशोधरा' के रचयिता कौन हैं?", opt: ["(A) मैथिलीशरण गुप्त", "(B) रामधारी सिंह दिनकर", "(C) सुमित्रानंदन पंत", "(D) जयशंकर प्रसाद", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'यशोधरा' (1932) राष्ट्रकवि मैथिलीशरण गुप्त द्वारा रचित एक चंपू काव्य (गद्य और पद्य का मिश्रित रूप) है। इसमें गौतम बुद्ध के संन्यास के बाद उनकी पत्नी यशोधरा की विरह व्यथा का वर्णन है।", fact: "\"अबला जीवन हाय तुम्हारी यही कहानी, आँचल में है दूध और आँखों में पानी\" यह प्रसिद्ध पंक्ति 'यशोधरा' से ही ली गई है।"},
            {q: "महाभारत के शांतिपर्व पर आधारित और युद्ध एवं शांति के दर्शन को प्रस्तुत करने वाला काव्य 'कुरुक्षेत्र' किसने लिखा है?", opt: ["(A) मैथिलीशरण गुप्त", "(B) माखनलाल चतुर्वेदी", "(C) रामधारी सिंह दिनकर", "(D) बालकृष्ण शर्मा 'नवीन'", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'कुरुक्षेत्र' (1946) रामधारी सिंह दिनकर का एक विचार-प्रधान काव्य है। इसमें भीष्म और युधिष्ठिर के संवाद के माध्यम से युद्ध की अनिवार्यता और शांति के महत्व पर विमर्श किया गया है।", fact: "दिनकर जी को 'कुरुक्षेत्र' के कारण विश्व के 100 सर्वश्रेष्ठ काव्यों में स्थान मिला है।"},
            {q: "राधा और कृष्ण के प्रेम को नए मनोवैज्ञानिक दृष्टिकोण से प्रस्तुत करने वाला काव्य 'कनुप्रिया' किसका है?", opt: ["(A) धर्मवीर भारती", "(B) हरिवंश राय बच्चन", "(C) सर्वेश्वर दयाल सक्सेना", "(D) भवानी प्रसाद मिश्र", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'कनुप्रिया' (1959) धर्मवीर भारती का एक प्रसिद्ध काव्य है, जिसमें राधा (प्रिया) के दृष्टिकोण से कृष्ण (कनु) के प्रति उनके असीम प्रेम और युद्ध की सार्थकता पर प्रश्न उठाए गए हैं।", fact: "'ठंडा लोहा' और 'सात गीत वर्ष' भी धर्मवीर भारती के प्रसिद्ध काव्य संग्रह हैं।"},
            {q: "किस काव्य-संग्रह की भूमिका को 'छायावाद का मेनिफेस्टो' (घोषणापत्र) कहा जाता है?", opt: ["(A) कामायनी", "(B) पल्लव", "(C) परिमल", "(D) यामा", "(E) इनमें से कोई नहीं"], ans: 1, expl: "सुमित्रानंदन पंत द्वारा रचित 'पल्लव' (1928) काव्य-संग्रह की विस्तृत भूमिका को हिंदी साहित्य में 'छायावाद का मेनिफेस्टो' माना जाता है, जिसमें उन्होंने ब्रजभाषा के स्थान पर खड़ी बोली का समर्थन किया।", fact: "सुमित्रानंदन पंत को उनके काव्य संग्रह 'कला और बूढ़ा चाँद' के लिए साहित्य अकादमी पुरस्कार मिला था।"},
            {q: "आदिकाल की श्रृंगार रस प्रधान रचना 'बीसलदेव रासो' के रचयिता कौन हैं?", opt: ["(A) चंदबरदाई", "(B) जगनिक", "(C) दलपति विजय", "(D) नरपति नाल्ह", "(E) इनमें से कोई नहीं"], ans: 3, expl: "'बीसलदेव रासो' आदिकाल के कवि नरपति नाल्ह द्वारा रचित एक प्रसिद्ध रासो काव्य है। अन्य रासो ग्रंथों के विपरीत, यह वीर रस की बजाय श्रृंगार रस (विरह) प्रधान काव्य है।", fact: "इसमें अजमेर के चौहान राजा बीसलदेव (विग्रहराज चतुर्थ) और मालवा की राजकुमारी राजमती के विवाह, वियोग और पुनर्मिलन की कथा है।"},
            {q: "हिंदी का प्रथम कवि किसे माना जाता है, जिनकी प्रसिद्ध रचना 'दोहाकोश' है?", opt: ["(A) स्वयंभू", "(B) सरहपा", "(C) विद्यापति", "(D) गोरखनाथ", "(E) इनमें से कोई नहीं"], ans: 1, expl: "राहुल सांकृत्यायन और अन्य विद्वानों के अनुसार, 8वीं शताब्दी के सिद्ध संत 'सरहपा' (सरहपाद) को हिंदी का प्रथम कवि माना जाता है। इनकी प्रमुख रचना 'दोहाकोश' है।", fact: "सिद्धों की कुल संख्या 84 मानी गई है, जिनमें सरहपा सबसे प्राचीन और प्रमुख हैं।"},
            {q: "प्रथम विश्वयुद्ध की पृष्ठभूमि पर आधारित और 'फ्लैशबैक' (पूर्वदीप्ति) शैली में लिखी गई हिंदी की पहली कहानी 'उसने कहा था' के लेखक कौन हैं?", opt: ["(A) मुंशी प्रेमचंद", "(B) जयशंकर प्रसाद", "(C) चंद्रधर शर्मा गुलेरी", "(D) विश्वंभरनाथ शर्मा 'कौशिक'", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'उसने कहा था' (1915) चंद्रधर शर्मा गुलेरी द्वारा रचित एक अमर प्रेम कहानी है। इसका मुख्य पात्र 'लहना सिंह' है, जो अपने बचपन के प्रेम (सूबेदारनी) को दिए गए वचन को निभाते हुए युद्ध में अपने प्राण त्याग देता है।", fact: "गुलेरी जी ने अपने जीवन में केवल तीन कहानियाँ लिखीं, जिनमें 'उसने कहा था' सबसे प्रसिद्ध है।"},
            {q: "मुंशी प्रेमचंद की अंतिम और सबसे यथार्थवादी कहानी कौन सी मानी जाती है?", opt: ["(A) पंच परमेश्वर", "(B) ईदगाह", "(C) बड़े घर की बेटी", "(D) कफ़न", "(E) इनमें से कोई नहीं"], ans: 3, expl: "'कफ़न' (1936) मुंशी प्रेमचंद की अंतिम कहानी है। इसमें घीसू और माधव जैसे पात्रों के माध्यम से दलित वर्ग की घोर गरीबी और संवेदनहीनता का कठोर यथार्थवादी चित्रण किया गया है।", fact: "प्रेमचंद ने लगभग 300 कहानियाँ लिखीं, जो 'मानसरोवर' के 8 भागों में संकलित हैं।"},
            {q: "बेमेल विवाह और दहेज प्रथा की समस्या पर आधारित मुंशी प्रेमचंद का प्रसिद्ध उपन्यास कौन सा है?", opt: ["(A) सेवासदन", "(B) गबन", "(C) निर्मला", "(D) रंगभूमि", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'निर्मला' (1927) मुंशी प्रेमचंद का एक अत्यंत मर्मस्पर्शी उपन्यास है, जो समाज में दहेज प्रथा और बेमेल विवाह के कारण एक युवती (निर्मला) के जीवन में आने वाली त्रासदियों को दर्शाता है।", fact: "'गबन' उपन्यास में महिलाओं के आभूषण प्रेम और उससे उत्पन्न समस्याओं का चित्रण है।"},
            {q: "'क्या भूलूँ क्या याद करूँ' किस प्रसिद्ध कवि की आत्मकथा का पहला भाग है?", opt: ["(A) हरिवंश राय बच्चन", "(B) सुमित्रानंदन पंत", "(C) रामधारी सिंह दिनकर", "(D) अज्ञेय", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'क्या भूलूँ क्या याद करूँ' (1969) हालावाद के प्रवर्तक हरिवंश राय बच्चन की आत्मकथा का पहला भाग है। इनकी आत्मकथा कुल चार भागों में प्रकाशित हुई है।", fact: "बच्चन जी की आत्मकथा के अन्य तीन भाग हैं: 'नीड़ का निर्माण फिर', 'बसेरे से दूर' और 'दशद्वार से सोपान तक'।"},
            {q: "रीतिकाल में वीर रस की कविताएँ लिखने वाले एकमात्र प्रमुख कवि कौन थे, जिन्होंने 'शिवा बावनी' लिखी?", opt: ["(A) बिहारी", "(B) घनानंद", "(C) मतिराम", "(D) महाकवि भूषण", "(E) इनमें से कोई नहीं"], ans: 3, expl: "रीतिकाल जहाँ श्रृंगार रस के लिए जाना जाता है, वहीं महाकवि भूषण ने वीर रस में काव्य रचना की। 'शिवा बावनी' में उन्होंने छत्रपति शिवाजी महाराज के शौर्य का 52 छंदों में वर्णन किया है।", fact: "'छत्रसाल दशक' और 'शिवराज भूषण' महाकवि भूषण की अन्य प्रसिद्ध रचनाएँ हैं।"},
            {q: "कठिन काव्य का प्रेत कहे जाने वाले कवि केशवदास की प्रसिद्ध रचना कौन सी है?", opt: ["(A) रामचंद्रिका", "(B) सुजान चरित्र", "(C) ललित ललाम", "(D) भाव विलास", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'रामचंद्रिका' (1601) रीतिकालीन कवि केशवदास की एक प्रबंध काव्य रचना है, जो रामकथा पर आधारित है। इसे 'छंदों का अजायबघर' भी कहा जाता है।", fact: "आचार्य रामचंद्र शुक्ल ने भाषा की क्लिष्टता के कारण केशवदास को 'कठिन काव्य का प्रेत' कहा था।"},
            {q: "रीतिकाल के सिद्ध कवि बिहारी लाल की एकमात्र रचना कौन सी है, जिसमें 700 से अधिक दोहे हैं?", opt: ["(A) रस मीमांसा", "(B) बिहारी सतसई", "(C) रसिकप्रिया", "(D) सुजान सागर", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'बिहारी सतसई' रीतिकाल के रीतिसिद्ध कवि बिहारी लाल की एकमात्र और अमर कृति है। इसमें 719 दोहे हैं (कुछ विद्वानों के अनुसार 713), जो मुख्य रूप से श्रृंगार रस पर आधारित हैं।", fact: "बिहारी के दोहों के बारे में कहा जाता है— \"सतसैया के दोहरे, ज्यों नावक के तीर। देखन में छोटे लगें, घाव करें गंभीर।\""},
            {q: "रीतिमुक्त काव्यधारा के प्रमुख कवि घनानंद की सर्वाधिक प्रसिद्ध रचना कौन सी है?", opt: ["(A) इश्कनामा", "(B) सुजान सागर", "(C) रसकेलि वल्ली", "(D) काव्य निर्णय", "(E) इनमें से कोई नहीं"], ans: 1, expl: "घनानंद रीतिमुक्त धारा के सर्वश्रेष्ठ श्रृंगारी कवि हैं। 'सुजान सागर' उनकी प्रसिद्ध रचना है, जिसमें उन्होंने अपनी प्रेमिका 'सुजान' के प्रति अपने असीम विरह और प्रेम को अभिव्यक्त किया है।", fact: "घनानंद को 'प्रेम की पीर का कवि' कहा जाता है।"},
            {q: "गोस्वामी तुलसीदास रचित 'विनय पत्रिका' की भाषा क्या है?", opt: ["(A) अवधी", "(B) खड़ी बोली", "(C) ब्रज भाषा", "(D) भोजपुरी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "यद्यपि तुलसीदास जी का 'रामचरितमानस' अवधी में है, लेकिन उनकी प्रसिद्ध रचना 'विनय पत्रिका' ब्रज भाषा में रचित है। इसमें भगवान राम के दरबार में कलिकाल (कलियुग) से मुक्ति हेतु एक अर्जी (विनय) प्रस्तुत की गई है।", fact: "कवितावली, गीतावली और दोहावली भी तुलसीदास जी की रचनाएँ हैं।"},
            {q: "आर्य समाज के संस्थापक स्वामी दयानंद सरस्वती की प्रमुख हिंदी गद्य रचना कौन सी है?", opt: ["(A) सत्यार्थ प्रकाश", "(B) वेदांत सूत्र", "(C) धर्म प्रकाश", "(D) कर्मयोग", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'सत्यार्थ प्रकाश' (1875) स्वामी दयानंद सरस्वती द्वारा रचित एक महत्वपूर्ण गद्य ग्रंथ है। यह हिंदी भाषा (खड़ी बोली) में लिखा गया है और आर्य समाज के सिद्धांतों का मुख्य आधार है।", fact: "स्वामी दयानंद सरस्वती ने \"वेदों की ओर लौटो\" का नारा दिया था।"},
            {q: "हिंदी आलोचना का मील का पत्थर मानी जाने वाली पुस्तक 'रस मीमांसा' के लेखक कौन हैं?", opt: ["(A) डॉ. नगेंद्र", "(B) आचार्य हजारी प्रसाद द्विवेदी", "(C) आचार्य रामचंद्र शुक्ल", "(D) बाबू गुलाबराय", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'रस मीमांसा' आचार्य रामचंद्र शुक्ल का एक उच्च कोटि का सैद्धांतिक आलोचना ग्रंथ है। इसमें उन्होंने भारतीय काव्यशास्त्र के रस सिद्धांत की मनोवैज्ञानिक और मौलिक व्याख्या की है।", fact: "रामचंद्र शुक्ल द्वारा रचित 'हिंदी साहित्य का इतिहास' (1929) हिंदी का सर्वाधिक प्रामाणिक इतिहास ग्रंथ माना जाता है।"},
            {q: "'सूरज का सातवाँ घोड़ा' नामक लघु उपन्यास किसने लिखा है?", opt: ["(A) फणीश्वर नाथ रेणु", "(B) धर्मवीर भारती", "(C) कमलेश्वर", "(D) मनोहर श्याम जोशी", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'सूरज का सातवाँ घोड़ा' (1952) धर्मवीर भारती का एक प्रयोगशील उपन्यास है, जिसमें माणिक मुल्ला द्वारा सुनाई गई अलग-अलग कहानियाँ अंत में एक मुख्य कथा में जुड़ जाती हैं।", fact: "इस उपन्यास पर प्रसिद्ध निर्देशक श्याम बेनेगल ने 1992 में इसी नाम से एक राष्ट्रीय पुरस्कार विजेता फिल्म बनाई थी।"},
            {q: "'मैला आँचल' के बाद फणीश्वर नाथ 'रेणु' का दूसरा सबसे प्रसिद्ध आंचलिक उपन्यास कौन सा है?", opt: ["(A) परती परिकथा", "(B) गोदान", "(C) आधा गाँव", "(D) जुलूस", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'परती परिकथा' (1957) फणीश्वर नाथ 'रेणु' का दूसरा महत्वपूर्ण आंचलिक उपन्यास है। इसमें पूर्णिया जिले के परानपुर गाँव की कथा और कोसी नदी के प्रभाव का चित्रण है।", fact: "रेणु जी की प्रसिद्ध कहानी 'मारे गए गुलफ़ाम' पर 'तीसरी कसम' नामक फिल्म बनी थी।"},
            {q: "राम सीता के वनवास पर आधारित अयोध्या सिंह उपाध्याय 'हरिऔध' का प्रसिद्ध प्रबंध काव्य कौन सा है?", opt: ["(A) प्रियप्रवास", "(B) साकेत", "(C) वैदेही वनवास", "(D) पंचवटी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'वैदेही वनवास' (1941) अयोध्या सिंह उपाध्याय 'हरिऔध' द्वारा रचित एक महत्वपूर्ण प्रबंध काव्य है, जिसमें माता सीता (वैदेही) के वनवास की कथा का अत्यंत करुण चित्रण है।", fact: "'रसकलश' और 'चोखे चौपदे' भी हरिऔध जी की प्रमुख काव्य कृतियाँ हैं।"},
            {q: "छायावाद की प्रथम प्रयोगशाला कहे जाने वाले काव्य-संग्रह 'झरना' के रचयिता कौन हैं?", opt: ["(A) सुमित्रानंदन पंत", "(B) सूर्यकांत त्रिपाठी निराला", "(C) जयशंकर प्रसाद", "(D) महादेवी वर्मा", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'झरना' (1918) जयशंकर प्रसाद का एक महत्वपूर्ण काव्य-संग्रह है। इसी रचना के साथ हिंदी साहित्य में छायावाद का आरंभ माना जाता है, इसलिए इसे 'छायावाद की प्रथम प्रयोगशाला' कहा जाता है।", fact: "'आँसू' और 'लहर' भी जयशंकर प्रसाद के अत्यंत प्रसिद्ध छायावादी काव्य-संग्रह हैं।"},
            {q: "महादेवी वर्मा द्वारा लिखित उनके समकालीन साहित्यकारों के संस्मरणात्मक रेखाचित्रों का संग्रह कौन सा है?", opt: ["(A) स्मृति की रेखाएं", "(B) अतीत के चलचित्र", "(C) पथ के साथी", "(D) मेरा परिवार", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'पथ के साथी' (1956) महादेवी वर्मा का एक प्रसिद्ध संस्मरण संग्रह है, जिसमें उन्होंने अपने समकालीन महान साहित्यकारों (जैसे- निराला, प्रसाद, पंत, मैथिलीशरण गुप्त आदि) के संस्मरण लिखे हैं।", fact: "'मेरा परिवार' में महादेवी वर्मा ने अपने पालतू पशु-पक्षियों (जैसे गिल्लू, नीलकंठ, सोना आदि) के संस्मरण लिखे हैं।"},
            {q: "ऐतिहासिक नाटकों की रचना के लिए प्रसिद्ध जयशंकर प्रसाद का बहुचर्चित नाटक कौन सा है?", opt: ["(A) स्कंदगुप्त", "(B) सिंदूर की होली", "(C) अंधा युग", "(D) आधे अधूरे", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'स्कंदगुप्त' (1928) जयशंकर प्रसाद का एक उत्कृष्ट ऐतिहासिक नाटक है, जिसमें गुप्त साम्राज्य के सम्राट स्कंदगुप्त के जीवन, विदेशी हूणों के आक्रमण और आंतरिक षड्यंत्रों का चित्रण किया गया है।", fact: "'चंद्रगुप्त' और 'ध्रुवस्वामिनी' भी जयशंकर प्रसाद के प्रसिद्ध ऐतिहासिक नाटक हैं।"},
            {q: "आचार्य रामचंद्र शुक्ल के अनुसार हिंदी की प्रथम कहानी के रूप में मान्य 'इन्दुमती' (1900 ई.) के लेखक कौन हैं?", opt: ["(A) माधवराव सप्रे", "(B) किशोरीलाल गोस्वामी", "(C) भगवानदास", "(D) रामचंद्र शुक्ल", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'इन्दुमती' कहानी किशोरीलाल गोस्वामी द्वारा लिखी गई थी और यह 1900 ई. में 'सरस्वती' पत्रिका में प्रकाशित हुई थी। आचार्य शुक्ल इसे हिंदी की पहली मौलिक कहानी मानते हैं।", fact: "कुछ विद्वान माधवराव सप्रे की 'एक टोकरी भर मिट्टी' (1901) को भी हिंदी की पहली कहानी मानते हैं।"},
            {q: "'रानी केतकी की कहानी' (जिसका दूसरा नाम 'उदयभान चरित' है) के लेखक कौन हैं?", opt: ["(A) लल्लू लाल", "(B) सदल मिश्र", "(C) इंशा अल्ला खाँ", "(D) सदासुखलाल", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'रानी केतकी की कहानी' मुंशी इंशा अल्ला खाँ द्वारा रचित प्रारंभिक हिंदी गद्य की एक महत्वपूर्ण रचना है। इसकी विशेषता यह है कि इसमें अरबी, फारसी और संस्कृत के शब्दों का प्रयोग नहीं किया गया है (इसे ठेठ हिंदी कहा गया)।", fact: "फोर्ट विलियम कॉलेज के बाहर रहकर मुंशी इंशा अल्ला खाँ ने इसकी रचना की थी।"},
            {q: "खड़ी बोली गद्य के आरंभिक ग्रंथों में प्रमुख 'प्रेमसागर' के रचनाकार कौन हैं?", opt: ["(A) इंशा अल्ला खाँ", "(B) लल्लू लाल", "(C) मुंशी सदासुखलाल", "(D) सदल मिश्र", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'प्रेमसागर' लल्लू लाल द्वारा ब्रजभाषा मिश्रित खड़ी बोली में लिखा गया एक प्रसिद्ध ग्रंथ है, जो श्रीमद्भागवत पुराण के दशम स्कंध पर आधारित है।", fact: "लल्लू लाल फोर्ट विलियम कॉलेज (कलकत्ता) में भाषा मुंशी (हिन्दुस्तानी विभाग) के पद पर कार्यरत थे।"},
            {q: "हिंदी का प्रथम मौलिक उपन्यास किसे माना जाता है?", opt: ["(A) परीक्षा गुरु", "(B) भाग्यवती", "(C) चंद्रकांता", "(D) नूतन ब्रह्मचारी", "(E) इनमें से कोई नहीं"], ans: 0, expl: "लाला श्रीनिवास दास द्वारा रचित 'परीक्षा गुरु' (1882 ई.) को आचार्य रामचंद्र शुक्ल सहित अधिकांश विद्वान हिंदी का प्रथम मौलिक उपन्यास मानते हैं।", fact: "इस उपन्यास में दिल्ली के एक रईस मदनमोहन के पतन और सुधार की कथा है।"},
            {q: "प्रसिद्ध 'सरस्वती' पत्रिका के वह प्रतापी संपादक कौन थे, जिन्हें हिंदी खड़ी बोली गद्य का परिष्कारक (युग-प्रवर्तक) माना जाता है?", opt: ["(A) चिंतामणि घोष", "(B) श्यामसुंदर दास", "(C) महावीर प्रसाद द्विवेदी", "(D) पदुमलाल पुन्नालाल बख्शी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "आचार्य महावीर प्रसाद द्विवेदी ने 1903 ई. से 1920 ई. तक 'सरस्वती' पत्रिका का संपादन किया। उन्होंने हिंदी गद्य और पद्य दोनों में खड़ी बोली को प्रतिष्ठित किया और व्याकरण की अशुद्धियों को दूर किया।", fact: "हिंदी साहित्य के 'द्विवेदी युग' (1900-1918) का नामकरण इन्हीं के नाम पर हुआ है।"},
            {q: "'भारत दुर्दशा' नामक प्रसिद्ध नाटक के रचयिता कौन हैं, जिसमें अंग्रेजी राज में भारत की दुर्दशा का चित्रण है?", opt: ["(A) जयशंकर प्रसाद", "(B) भारतेन्दु हरिश्चंद्र", "(C) बालकृष्ण भट्ट", "(D) प्रतापनारायण मिश्र", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'भारत दुर्दशा' (1880) भारतेन्दु हरिश्चंद्र का एक प्रसिद्ध नाट्य-रासक है, जिसमें उन्होंने प्रतीकात्मक शैली में भारत की तत्कालीन राजनीतिक, सामाजिक और आर्थिक दुर्दशा का यथार्थ चित्रण किया है।", fact: "'सत्य हरिश्चंद्र' और 'चंद्रावली' भी भारतेन्दु जी के प्रमुख नाटक हैं।"},
            {q: "हिंदी गद्य के चार प्रारंभिक उन्नायकों में से एक, मुंशी सदासुखलाल 'नियाज' की प्रसिद्ध रचना कौन सी है?", opt: ["(A) नासिकेतोपाख्यान", "(B) चंद छंद बरनन की महिमा", "(C) सुखसागर", "(D) योगवाशिष्ठ", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'सुखसागर' मुंशी सदासुखलाल 'नियाज' की रचना है, जो विष्णु पुराण पर आधारित है। इनकी भाषा बहुत प्रांजल और शिष्ट थी, जिसमें संस्कृतनिष्ठता थी।", fact: "हिंदी गद्य के चार उन्नायक लल्लू लाल, सदल मिश्र, इंशा अल्ला खाँ और मुंशी सदासुखलाल माने जाते हैं।"},
            {q: "हिंदी के प्रथम नाटक के रूप में मान्य 'नहुष' के रचयिता कौन हैं?", opt: ["(A) गोपालचंद्र 'गिरिधरदास'", "(B) प्राणचंद चौहान", "(C) राजा शिवप्रसाद सितारेहिन्द", "(D) लक्ष्मण सिंह", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'नहुष' (1859 ई.) नाटक की रचना भारतेन्दु हरिश्चंद्र के पिता बाबू गोपालचंद्र (जिनका उपनाम 'गिरिधरदास' था) ने ब्रजभाषा में की थी। इसे भारतेन्दु जी ने हिंदी का प्रथम नाटक माना है।", fact: "आधुनिक ढंग का पहला अभिनित नाटक 'जानकी मंगल' (शीतला प्रसाद त्रिपाठी कृत) माना जाता है।"},
            {q: "नारी विमर्श और स्त्री पुनर्विवाह पर आधारित जयशंकर प्रसाद का अंतिम नाटक कौन सा है?", opt: ["(A) अजातशत्रु", "(B) राज्यश्री", "(C) ध्रुवस्वामिनी", "(D) विशाख", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'ध्रुवस्वामिनी' (1933) जयशंकर प्रसाद का अंतिम और अत्यंत महत्वपूर्ण नाटक है। इसमें गुप्तकालीन ऐतिहासिक पृष्ठभूमि के माध्यम से स्त्री के अधिकार और पुनर्विवाह की समस्या को उठाया गया है।", fact: "इस नाटक में रामगुप्त, चंद्रगुप्त और ध्रुवस्वामिनी मुख्य पात्र हैं।"},
            {q: "हिंदी का प्रथम सूफी प्रेमाख्यानक काव्य किसे माना जाता है, जिसके रचयिता मुल्ला दाऊद हैं?", opt: ["(A) पद्मावत", "(B) मृगावती", "(C) चंदायन", "(D) मधुमालती", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'चंदायन' (1379 ई.) मुल्ला दाऊद द्वारा रचित अवधी भाषा का प्रथम प्रेमाख्यानक (सूफी) काव्य है। इसमें लोरिक और चंदा की प्रेम कथा का वर्णन है।", fact: "माताप्रसाद गुप्त ने इसे 'लोर कहा' या 'लोर कथा' भी कहा है।"},
            {q: "ब्रजभाषा में रचित 'सुदामा चरित' नामक प्रसिद्ध खंडकाव्य के रचनाकार कौन हैं?", opt: ["(A) रसखान", "(B) नरोत्तमदास", "(C) सूरदास", "(D) नंददास", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'सुदामा चरित' भक्तिकालीन कवि नरोत्तमदास की एक अत्यंत लोकप्रिय रचना है, जिसमें भगवान कृष्ण और उनके बाल-सखा सुदामा की मित्रता का मार्मिक वर्णन ब्रजभाषा में किया गया है।", fact: "\"पानी परात को हाथ छुयो नहिं, नैनन के जल सों पग धोये\" यह प्रसिद्ध पंक्ति इसी काव्य की है।"},
            {q: "श्रृंगार रस और नायिका-भेद पर आधारित 'साहित्य लहरी' किस भक्तिकालीन कवि की रचना है?", opt: ["(A) सूरदास", "(B) तुलसीदास", "(C) कबीरदास", "(D) मीराबाई", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'साहित्य लहरी' सूरदास की प्रामाणिक रचनाओं में से एक है। इसमें 118 दृष्टिकूट पद (अर्थात ऐसे पद जिनका अर्थ सीधे न निकलकर घुमा-फिरा कर निकलता है) संकलित हैं।", fact: "सूरसागर और सूरसारावली भी सूरदास की प्रमुख रचनाएँ हैं।"},
            {q: "कालिदास के नाटक मालविकाग्निमित्रम् के पात्र 'नंद' पर आधारित नाटक 'लहरों के राजहंस' के लेखक कौन हैं?", opt: ["(A) जगदीशचंद्र माथुर", "(B) सुरेन्द्र वर्मा", "(C) मोहन राकेश", "(D) भीष्म साहनी", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'लहरों के राजहंस' (1963) मोहन राकेश का एक प्रसिद्ध नाटक है। यह अश्वघोष के महाकाव्य 'सौंदरनंद' पर आधारित है, जिसमें गौतम बुद्ध के सौतेले भाई नंद और उनकी पत्नी सुंदरी के द्वंद्व का चित्रण है।", fact: "'आधे अधूरे' और 'आषाढ़ का एक दिन' भी मोहन राकेश के प्रसिद्ध नाटक हैं।"},
            {q: "हास्य-व्यंग्य से पूर्ण 'ठलुआ क्लब' नामक प्रसिद्ध निबंध संग्रह के लेखक कौन हैं?", opt: ["(A) हरिशंकर परसाई", "(B) शरद जोशी", "(C) बाबू गुलाबराय", "(D) विद्यानिवास मिश्र", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'ठलुआ क्लब' (1928) बाबू गुलाबराय का एक अत्यंत लोकप्रिय हास्य-व्यंग्य निबंध संग्रह है। इसमें उन्होंने समाज की विसंगतियों पर हल्के-फुल्के अंदाज में कटाक्ष किया है।", fact: "'मेरी असफलताएं' भी बाबू गुलाबराय की एक प्रसिद्ध आत्मकथात्मक निबंध रचना है।"},
            {q: "'गेहूँ और गुलाब' नामक प्रसिद्ध निबंध/रेखाचित्र के रचयिता कौन हैं, जिसमें गेहूँ भौतिकता का और गुलाब संस्कृति का प्रतीक है?", opt: ["(A) रामवृक्ष बेनीपुरी", "(B) हजारी प्रसाद द्विवेदी", "(C) कन्हैयालाल मिश्र 'प्रभाकर'", "(D) महादेवी वर्मा", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'गेहूँ और गुलाब' (1950) रामवृक्ष बेनीपुरी का एक श्रेष्ठ ललित निबंध और रेखाचित्र संग्रह है। इसमें गेहूँ (भूख/श्रम) और गुलाब (कला/सौंदर्य) के बीच संतुलन की आवश्यकता पर बल दिया गया है।", fact: "बेनीपुरी जी ने 'तरुण भारत' और 'किसान मित्र' जैसे पत्रों का संपादन भी किया।"},
            {q: "मिथिला क्षेत्र की पृष्ठभूमि पर आधारित आंचलिक उपन्यास 'बलचनमा' और 'रतिनाथ की चाची' के लेखक कौन हैं?", opt: ["(A) फणीश्वर नाथ रेणु", "(B) नागार्जुन", "(C) रामदरश मिश्र", "(D) शिवप्रसाद सिंह", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'बलचनमा' (1952) और 'रतिनाथ की चाची' प्रगतिवादी कवि और कथाकार नागार्जुन के प्रसिद्ध आंचलिक उपन्यास हैं, जिनमें बिहार के ग्रामीण जीवन का यथार्थ चित्रण है।", fact: "नागार्जुन का वास्तविक नाम 'वैद्यनाथ मिश्र' था और वे मैथिली भाषा में 'यात्री' उपनाम से लिखते थे।"},
            {q: "प्रयोगवादी शैली में रचित 'नदी के द्वीप' और 'अपने-अपने अजनबी' उपन्यासों के लेखक कौन हैं?", opt: ["(A) इलाचंद्र जोशी", "(B) जैनेंद्र", "(C) अज्ञेय", "(D) यशपाल", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'नदी के द्वीप' (1951) और 'अपने-अपने अजनबी' (1961) सच्चिदानंद हीरानंद वात्स्यायन 'अज्ञेय' के प्रसिद्ध मनोवैज्ञानिक उपन्यास हैं, जिनमें व्यक्तिवाद और अस्तित्ववाद का गहरा प्रभाव दिखता है।", fact: "'शेखर एक जीवनी' भी अज्ञेय का ही प्रसिद्ध उपन्यास है।"},
            {q: "नचिकेता के प्रसंग (कठोपनिषद) पर आधारित 'आत्मजयी' नामक प्रसिद्ध प्रबंध काव्य के रचयिता कौन हैं?", opt: ["(A) नरेश मेहता", "(B) कुंवर नारायण", "(C) धर्मवीर भारती", "(D) दुष्यंत कुमार", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'आत्मजयी' (1965) नई कविता के प्रमुख हस्ताक्षर कुंवर नारायण का एक श्रेष्ठ प्रबंध काव्य है। इसमें कठोपनिषद के नचिकेता-यम संवाद के माध्यम से आधुनिक मानव की मृत्यु और जीवन संबंधी शंकाओं का समाधान प्रस्तुत किया गया है।", fact: "कुंवर नारायण को 2005 में साहित्य का सर्वोच्च ज्ञानपीठ पुरस्कार प्राप्त हुआ था।"},
            {q: "'आलोचकों का आलोचक' कहे जाने वाले नामवर सिंह की वह कौन सी प्रसिद्ध पुस्तक है जिस पर उन्हें साहित्य अकादमी पुरस्कार मिला?", opt: ["(A) दूसरी परंपरा की खोज", "(B) कविता के नए प्रतिमान", "(C) छायावाद", "(D) इतिहास और आलोचना", "(E) इनमें से कोई नहीं"], ans: 1, expl: "'कविता के नए प्रतिमान' (1968) हिंदी के शीर्ष आलोचक डॉ. नामवर सिंह की एक प्रसिद्ध आलोचनात्मक पुस्तक है। इस पुस्तक के लिए उन्हें 1971 में साहित्य अकादमी पुरस्कार प्रदान किया गया था।", fact: "इस पुस्तक में उन्होंने मुख्य रूप से 'मुक्तिबोध' की कविताओं की विस्तृत समीक्षा की है।"},
            {q: "ललित निबंधों के लिए प्रसिद्ध रचना 'रस आखेटक' और 'प्रिया नीलकंठी' के लेखक कौन हैं?", opt: ["(A) विद्यानिवास मिश्र", "(B) कुबेरनाथ राय", "(C) हजारी प्रसाद द्विवेदी", "(D) विवेकी राय", "(E) इनमें से कोई नहीं"], ans: 1, expl: "कुबेरनाथ राय हिंदी के उच्च कोटि के ललित निबंधकार हैं। 'प्रिया नीलकंठी' और 'रस आखेटक' उनके अत्यंत प्रसिद्ध निबंध संग्रह हैं, जिनमें भारतीय संस्कृति, प्रकृति और दर्शन का अनूठा संगम है।", fact: "कुबेरनाथ राय की निबंध शैली पर आचार्य हजारी प्रसाद द्विवेदी का गहरा प्रभाव माना जाता है।"},
            {q: "हिंदी साहित्य में दलित विमर्श पर आधारित प्रसिद्ध आत्मकथा 'जूठन' के लेखक कौन हैं?", opt: ["(A) मोहनदास नैमिशराय", "(B) सूरजपाल चौहान", "(C) ओमप्रकाश वाल्मीकि", "(D) सुशीला टाकभौरे", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'जूठन' (1997) ओमप्रकाश वाल्मीकि की अत्यंत चर्चित और मार्मिक आत्मकथा है। यह हिंदी साहित्य में दलित चेतना और विमर्श की एक मील का पत्थर रचना मानी जाती है।", fact: "ओमप्रकाश वाल्मीकि की प्रसिद्ध कविता 'सदियों का संताप' भी दलित विमर्श की प्रमुख रचना है।"},
            {q: "लखनऊ की पृष्ठभूमि पर लिखे गए उपन्यास 'सुहाग के नूपुर' और 'बूंद और समुद्र' के लेखक कौन हैं?", opt: ["(A) भगवती चरण वर्मा", "(B) शिवप्रसाद सिंह", "(C) अमृतलाल नागर", "(D) रांगेय राघव", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'सुहाग के नूपुर' (माधवी और कन्नगी की कथा) और 'बूंद और समुद्र' (लखनऊ के चौक की पृष्ठभूमि) अमृतलाल नागर के अत्यंत प्रसिद्ध उपन्यास हैं।", fact: "नागर जी के 'अमृत और विष' उपन्यास के लिए उन्हें साहित्य अकादमी पुरस्कार मिला था।"},
            {q: "डॉ. रामकुमार वर्मा और कई अन्य विद्वानों द्वारा हिंदी की प्रथम एकांकी मानी जाने वाली रचना 'एक घूँट' (1930) के रचयिता कौन हैं?", opt: ["(A) भुवनेश्वर", "(B) उपेन्द्रनाथ 'अश्क'", "(C) जयशंकर प्रसाद", "(D) सेठ गोविंद दास", "(E) इनमें से कोई नहीं"], ans: 2, expl: "'एक घूँट' (1930) को जयशंकर प्रसाद ने लिखा था और इसे हिंदी एकांकी (One-act play) का प्रारंभिक या प्रथम रूप माना जाता है। इसमें आनंदवाद का संदेश दिया गया है।", fact: "डॉ. रामकुमार वर्मा कृत 'बादल की मृत्यु' (1930) को भी कुछ विद्वान पहली आधुनिक एकांकी मानते हैं।"},
            {q: "आदिकालीन गद्य की प्रसिद्ध राजस्थानी रचना 'गोरा बादल की कथा' के लेखक कौन हैं?", opt: ["(A) जटमल", "(B) चंदबरदाई", "(C) कल्हण", "(D) लल्लू लाल", "(E) इनमें से कोई नहीं"], ans: 0, expl: "'गोरा बादल की कथा' (लगभग 1623 ई.) राजस्थानी गद्य की एक ऐतिहासिक रचना है, जिसे 'जटमल' ने लिखा है। इसमें चित्तौड़ के शूरवीर गोरा और बादल के पराक्रम का वर्णन है।", fact: "अलाउद्दीन खिलजी के चित्तौड़ आक्रमण के समय गोरा और बादल रानी पद्मिनी के रक्षक और सेनापति थे।"}
        ];

        // Status codes: 0 = not visited, 1 = correct, 2 = incorrect, 3 = unanswered, 4 = skipped, 5 = review
        let currentQIndex = 0;
        let qStatus = new Array(100).fill(0);
        
        const ui = {
            stem: document.getElementById('q-stem'),
            optionsBox: document.getElementById('options-container'),
            counter: document.getElementById('q-counter'),
            scoreLabel: document.getElementById('live-score'),
            explBox: document.getElementById('expl-box'),
            explText: document.getElementById('expl-text'),
            explFactText: document.getElementById('expl-fact-text'),
            btnSkip: document.getElementById('btn-skip'),
            btnReview: document.getElementById('btn-review'),
            btnNext: document.getElementById('btn-next'),
            btnFinish: document.getElementById('btn-finish'),
            paletteGrid: document.getElementById('palette-grid'),
            quizContainer: document.getElementById('quiz-container'),
            reportContainer: document.getElementById('report-container')
        };

        function init() {
            renderPalette();
            loadQuestion(0);
        }

        function loadQuestion(index) {
            currentQIndex = index;
            const q = qData[index];
            
            // Mark as visited (unanswered) if not previously answered, skipped or reviewed
            if (qStatus[index] === 0) {
                qStatus[index] = 3; 
            }

            ui.stem.innerText = `Q${index + 1}. ${q.q}`;
            ui.counter.innerText = `Question ${index + 1} of 100`;
            ui.explBox.classList.remove('active');
            
            // Generate Options
            ui.optionsBox.innerHTML = '';
            q.opt.forEach((optText, i) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-item';
                optDiv.innerText = optText;
                
                // If already answered, lock options and show result
                if (qStatus[index] === 1 || qStatus[index] === 2) {
                    optDiv.classList.add('locked');
                    if (i === q.ans) optDiv.classList.add('reveal-correct');
                } else {
                    optDiv.onclick = () => handleAnswer(i);
                }
                
                ui.optionsBox.appendChild(optDiv);
            });

            // Show explanation if already answered
            if (qStatus[index] === 1 || qStatus[index] === 2) {
                showExplanation();
            }

            // Controls visibility
            if (index === 99) {
                ui.btnNext.style.display = 'none';
                ui.btnFinish.style.display = 'inline-block';
            } else {
                ui.btnNext.style.display = 'inline-block';
                ui.btnFinish.style.display = 'none';
            }

            updatePaletteUI();
        }

        function handleAnswer(selectedIndex) {
            if (qStatus[currentQIndex] === 1 || qStatus[currentQIndex] === 2) return; // Prevent double answer

            const q = qData[currentQIndex];
            const opts = ui.optionsBox.children;
            
            // Lock all options
            for (let opt of opts) {
                opt.classList.add('locked');
                opt.onclick = null;
            }

            if (selectedIndex === q.ans) {
                opts[selectedIndex].classList.add('correct');
                qStatus[currentQIndex] = 1; // Correct
            } else {
                opts[selectedIndex].classList.add('incorrect');
                opts[q.ans].classList.add('reveal-correct');
                qStatus[currentQIndex] = 2; // Incorrect
            }

            updateScore();
            updatePaletteUI();
            showExplanation();
        }

        function showExplanation() {
            const q = qData[currentQIndex];
            ui.explText.innerText = q.expl;
            ui.explFactText.innerText = q.fact;
            ui.explBox.classList.add('active');
        }

        function handleSkip() {
            if (qStatus[currentQIndex] !== 1 && qStatus[currentQIndex] !== 2) {
                qStatus[currentQIndex] = 4; // Skipped
                updatePaletteUI();
            }
            handleNext();
        }

        function handleReview() {
            if (qStatus[currentQIndex] !== 1 && qStatus[currentQIndex] !== 2) {
                qStatus[currentQIndex] = 5; // Review
                updatePaletteUI();
            }
            handleNext();
        }

        function handleNext() {
            if (currentQIndex < 99) {
                loadQuestion(currentQIndex + 1);
            }
        }

        function updateScore() {
            let correct = 0, incorrect = 0;
            qStatus.forEach(status => {
                if (status === 1) correct++;
                if (status === 2) incorrect++;
            });
            const netScore = (correct * 1.0) - (incorrect * 0.25);
            ui.scoreLabel.innerText = netScore.toFixed(2);
        }

        function renderPalette() {
            ui.paletteGrid.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const btn = document.createElement('button');
                btn.className = 'palette-btn s-notvisited';
                btn.innerText = i + 1;
                btn.onclick = () => {
                    loadQuestion(i);
                    togglePalette();
                };
                ui.paletteGrid.appendChild(btn);
            }
        }

        function updatePaletteUI() {
            const btns = ui.paletteGrid.children;
            for (let i = 0; i < 100; i++) {
                btns[i].className = 'palette-btn';
                
                // Active Question Highlight
                if (i === currentQIndex) btns[i].classList.add('current');
                
                switch (qStatus[i]) {
                    case 0: btns[i].classList.add('s-notvisited'); break;
                    case 1: btns[i].classList.add('s-correct'); break;
                    case 2: btns[i].classList.add('s-incorrect'); break;
                    case 3: btns[i].classList.add('s-unanswered'); break;
                    case 4: btns[i].classList.add('s-skipped'); break;
                    case 5: btns[i].classList.add('s-review'); break;
                }
            }
        }

        function togglePalette() {
            document.body.classList.toggle('palette-active');
        }

        function finishExam() {
            if(confirm("Are you sure you want to submit the exam and view your final score?")) {
                ui.quizContainer.style.display = 'none';
                ui.reportContainer.style.display = 'block';
                
                let correct = 0, incorrect = 0, unattempted = 0;
                qStatus.forEach(status => {
                    if (status === 1) correct++;
                    else if (status === 2) incorrect++;
                    else unattempted++;
                });
                
                const netScore = (correct * 1.0) - (incorrect * 0.25);
                
                document.getElementById('r-score').innerText = netScore.toFixed(2);
                document.getElementById('r-correct').innerText = correct;
                document.getElementById('r-incorrect').innerText = incorrect;
                document.getElementById('r-unattempted').innerText = unattempted;
            }
        }

        // Initialize App
        window.onload = init;
    </script>
</body>
</html>
