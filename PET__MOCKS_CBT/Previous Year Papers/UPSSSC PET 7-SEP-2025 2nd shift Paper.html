<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSSSC PET Full Mock Exam Simulator (100 Questions)</title>
  <style>
    :root {
      --bg-dark: #121316;
      --card-dark: #1e2024;
      --card-border: #2e323b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f59e0b;
      --purple: #8b5cf6;
      --gray: #6b7280;
      --dark-gray: #374151;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: var(--card-dark);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #60a5fa;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .badge {
      background: #111827;
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .badge span {
      color: var(--green);
    }
    .btn-palette {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .btn-palette:hover {
      background-color: var(--accent-hover);
    }
    main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 24px auto;
      padding: 0 16px;
    }
    .question-card {
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }
    .q-number {
      font-size: 1.1rem;
      font-weight: 700;
      color: #93c5fd;
    }
    .q-marking {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .visual-container {
      margin-bottom: 24px;
      background: #15171b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
    }
    .passage-box {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #d1d5db;
      border-left: 4px solid var(--accent);
      padding: 12px 18px;
      background: #17191e;
      border-radius: 0 8px 8px 0;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      text-align: left;
    }
    .data-table th, .data-table td {
      border: 1px solid var(--card-border);
      padding: 10px 14px;
    }
    .data-table th {
      background-color: #262a32;
      color: #60a5fa;
      font-weight: 600;
    }
    .data-table tr:nth-child(even) {
      background-color: #1a1c22;
    }
    .chart-svg {
      width: 100%;
      max-width: 720px;
      display: block;
      margin: 0 auto;
    }
    .q-stem {
      font-size: 1.12rem;
      line-height: 1.6;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .q-stem .hi {
      margin-top: 6px;
      color: #e5e7eb;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .opt-btn {
      background-color: #262930;
      border: 2px solid var(--card-border);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 8px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }
    .opt-btn:hover:not(:disabled) {
      background-color: #313640;
      border-color: #4b5563;
    }
    .opt-btn.correct {
      background-color: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--green) !important;
      color: #34d399 !important;
    }
    .opt-btn.incorrect {
      background-color: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--red) !important;
      color: #f87171 !important;
    }
    .opt-tag {
      font-weight: 700;
      color: #93c5fd;
      flex-shrink: 0;
    }
    .explanation-card {
      margin-top: 24px;
      background: #17191e;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 20px;
      border-left: 4px solid var(--green);
      display: none;
    }
    .explanation-card.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    .exp-title {
      font-weight: 700;
      color: var(--green);
      margin-bottom: 8px;
      font-size: 1rem;
    }
    .exp-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #d1d5db;
    }
    .exp-key-fact {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--card-border);
      font-size: 0.9rem;
      color: #fbbf24;
    }
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-nav {
      background: #2b303c;
      color: #f3f4f6;
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-nav:hover:not(:disabled) {
      background: #3a4150;
    }
    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-mark {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--purple);
      color: #c4b5fd;
    }
    .btn-skip {
      background: rgba(107, 114, 128, 0.2);
      border: 1px solid var(--gray);
      color: #e5e7eb;
    }
    .btn-submit {
      background: #059669;
      color: #fff;
      border: none;
    }
    .btn-submit:hover {
      background: #047857;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(2px);
      z-index: 50;
      display: none;
    }
    .modal-overlay.active {
      display: block;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 90vw;
      height: 100vh;
      background: var(--card-dark);
      border-left: 1px solid var(--card-border);
      z-index: 60;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -6px 0 24px rgba(0,0,0,0.5);
    }
    .drawer.active {
      right: 0;
    }
    .drawer-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #60a5fa;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }
    .palette-legend {
      padding: 12px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.78rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .palette-grid {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .p-node {
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: var(--dark-gray);
      color: #e5e7eb;
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }
    .p-node:hover {
      transform: scale(1.05);
      border-color: #93c5fd;
    }
    .p-node.current {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    .p-node.status-correct {
      background-color: var(--green) !important;
      color: #fff;
    }
    .p-node.status-incorrect {
      background-color: var(--red) !important;
      color: #fff;
    }
    .p-node.status-unanswered {
      background-color: var(--orange) !important;
      color: #111;
    }
    .p-node.status-skipped {
      background-color: var(--gray) !important;
      color: #fff;
    }
    .p-node.status-marked {
      background-color: var(--purple) !important;
      color: #fff;
    }
    .p-node.status-unvisited {
      background-color: var(--dark-gray);
      color: #9ca3af;
    }
    .report-card {
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 32px;
      max-width: 900px;
      margin: 30px auto;
    }
    .score-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }
    .summary-box {
      background: #15171b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .summary-box .val {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .summary-box .lbl {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">UPSSSC PET 7-SEP-2025 2nd shift Paper</div>
  <div class="header-meta">
    <div class="badge">Question <span id="q-counter">1/100</span></div>
    <div class="badge">Live Score: <span id="score-counter">0.00</span></div>
    <button class="btn-palette" onclick="togglePalette(true)">📋 Open Palette</button>
  </div>
</header>

<div class="modal-overlay" id="palette-overlay" onclick="togglePalette(false)"></div>

<div class="drawer" id="palette-drawer">
  <div class="drawer-header">
    <div class="drawer-title">Question Palette (100)</div>
    <button class="btn-close" onclick="togglePalette(false)">&times;</button>
  </div>
  <div class="palette-legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Correct (+1.0)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Incorrect (-0.25)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div> Unanswered</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--gray)"></div> Skipped</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div> Marked Review</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--dark-gray)"></div> Not Visited</div>
  </div>
  <div class="palette-grid" id="palette-grid-items"></div>
</div>

<main id="main-content">
  <div class="question-card" id="q-view">
    <div class="q-meta">
      <div class="q-number" id="q-label">Question 1</div>
      <div class="q-marking">+1.00 for Correct | -0.25 for Incorrect</div>
    </div>

    <div id="visual-slot"></div>

    <div class="q-stem" id="q-stem"></div>

    <div class="options-grid" id="options-slot"></div>

    <div class="explanation-card" id="explanation-slot">
      <div class="exp-title">Detailed Solution / समाधान</div>
      <div class="exp-content" id="exp-text"></div>
      <div class="exp-key-fact" id="exp-fact"></div>
    </div>

    <div class="action-bar">
      <div style="display:flex; gap:10px;">
        <button class="btn-nav" id="btn-prev" onclick="navigateQuestion(-1)">&#8592; Previous</button>
        <button class="btn-nav" id="btn-next" onclick="navigateQuestion(1)">Next &#8594;</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-nav btn-mark" id="btn-mark" onclick="toggleMarkForReview()">Mark for Review</button>
        <button class="btn-nav btn-skip" id="btn-skip" onclick="skipCurrentQuestion()">Skip Question</button>
        <button class="btn-nav btn-submit" onclick="submitExam()">Submit Test</button>
      </div>
    </div>
  </div>

  <div id="report-view" style="display:none;"></div>
</main>

<script>
const questionsData = [
  {
    id: 1,
    stemEn: "Ninth Five Year Plan focused on:",
    stemHi: "नौवीं पंचवर्षीय योजना ______ पर केंद्रित थी।",
    options: [
      { tag: "A", en: "Growth with economic justice", hi: "आर्थिक न्याय के साथ विकास" },
      { tag: "B", en: "Growth with education and employment", hi: "शिक्षा और रोजगार के साथ विकास" },
      { tag: "C", en: "Growth with employment", hi: "रोजगार के साथ विकास" },
      { tag: "D", en: "Growth with social justice and equality", hi: "सामाजिक न्याय और समानता के साथ विकास" },
      { tag: "E", en: "None of these", hi: "इनमें से कोई नहीं" }
    ],
    correct: "D",
    expEn: "The Ninth Five-Year Plan (1997–2002) was launched in the 50th year of India's independence under the Prime Ministership of Atal Bihari Vajpayee. Its primary focus was 'Growth with Social Justice and Equality'.",
    expHi: "नौवीं पंचवर्षीय योजना (1997-2002) भारत की स्वतंत्रता के 50वें वर्ष में शुरू की गई थी। इस योजना का मुख्य विषय/उद्देश्य 'सामाजिक न्याय और समानता के साथ विकास' था।",
    keyFact: "The Ninth Plan targeted a GDP growth rate of 7.0% but achieved approximately 5.6%."
  },
  {
    id: 2,
    stemEn: "Vinay is taller than Hansika, Hansika is taller than Abhay, Aalok is taller than Ashok and Ashok is taller than Vinay. Who is the shortest in the group?",
    stemHi: "विनय हंसिका से लंबा है, हंसिका अभय से लंबी है, आलोक अशोक से लंबा है और अशोक विनय से लंबा है। समूह में सबसे छोटा कौन है?",
    options: [
      { tag: "A", en: "Ashok", hi: "अशोक" },
      { tag: "B", en: "Hansika", hi: "हंसिका" },
      { tag: "C", en: "Aalok", hi: "आलोक" },
      { tag: "D", en: "Abhay", hi: "अभय" },
      { tag: "E", en: "None of these", hi: "इनमें से कोई नहीं" }
    ],
    correct: "D",
    expEn: "Ranking sequence by descending height: Aalok > Ashok > Vinay > Hansika > Abhay. Hence, Abhay is the shortest.",
    expHi: "ऊँचाई का अवरोही क्रम: आलोक > अशोक > विनय > हंसिका > अभय। अतः समूह में सबसे छोटा व्यक्ति अभय है।",
    keyFact: "Chaining linear inequalities directly resolves relative order."
  },
  {
    id: 3,
    stemEn: "On December 20, 2024 the Government of India signed a $500 million loan agreement with which international organization to support green and sustainable infrastructure projects?",
    stemHi: "20 दिसंबर, 2024 को भारत सरकार ने हरित और टिकाऊ बुनियादी ढाँचा परियोजनाओं के समर्थन हेतु किस अंतर्राष्ट्रीय संगठन के साथ 500 मिलियन डॉलर के ऋण समझौते पर हस्ताक्षर किए?",
    options: [
      { tag: "A", en: "International Monetary Fund (IMF)", hi: "अंतर्राष्ट्रीय मुद्रा कोष (IMF)" },
      { tag: "B", en: "Asian Infrastructure Investment Bank (AIIB)", hi: "एशियाई अवसंरचना निवेश बैंक (AIIB)" },
      { tag: "C", en: "World Bank", hi: "विश्व बैंक" },
      { tag: "D", en: "Asian Development Bank (ADB)", hi: "एशियाई विकास बैंक (ADB)" },
      { tag: "E", en: "None of these", hi: "इनमें से कोई नहीं" }
    ],
    correct: "D",
    expEn: "On December 20, 2024, the Government of India and the Asian Development Bank (ADB) signed a $500 million loan agreement to finance green and climate-resilient infrastructure.",
    expHi: "20 दिसंबर, 2024 को भारत सरकार और एशियाई विकास बैंक (ADB) ने हरित और जलवायु-अनुकूल बुनियादी ढांचा परियोजनाओं को सुदृढ़ करने हेतु 500 मिलियन डॉलर के ऋण समझौते पर हस्ताक्षर किए।",
    keyFact: "ADB was established in 1966 with headquarters in Manila, Philippines."
  },
  {
    id: 4,
    stemEn: "The number of whole numbers between 437 and 487 is:",
    stemHi: "437 और 487 के बीच पूर्ण संख्याओं की संख्या क्या है?",
    options: [
      { tag: "A", en: "50", hi: "50" },
      { tag: "B", en: "51", hi: "51" },
      { tag: "C", en: "49", hi: "49" },
      { tag: "D", en: "48", hi: "48" },
      { tag: "E", en: "None of these", hi: "इनमें से कोई नहीं" }
    ],
    correct: "C",
    expEn: "Number of whole numbers strictly between a and b = (b - a) - 1 = (487 - 437) - 1 = 50 - 1 = 49.",
    expHi: "संख्या सूत्र: (487 - 437) - 1 = 50 - 1 = 49 पूर्ण संख्याएँ।",
    keyFact: "Between a and b excludes both endpoints: (b - a - 1)."
  },
  {
    id: 5,
    stemEn: "GATT stands for:",
    stemHi: "GATT का तात्पर्य ______ से है।",
    options: [
      { tag: "A", en: "General Agreement on Tariffs and Trade", hi: "जनरल अग्रिमेंट ऑन टैरिफ्स एण्ड ट्रेड" },
      { tag: "B", en: "General Agreement on Tax and Trade", hi: "जनरल अग्रिमेंट ऑन टैक्स एण्ड ट्रेड" },
      { tag: "C", en: "General Agreement on Trade and Terms", hi: "जनरल अग्रिमेट ऑन ट्रेड एण्ड टर्मस" },
      { tag: "D", en: "General Agreement on Tariffs and Tax", hi: "जनरल अग्रिमेंट ऑन टैरिफ्स एण्ड टैक्स" },
      { tag: "E", en: "None of these", hi: "इनमें से कोई नहीं" }
    ],
    correct: "A",
    expEn: "GATT stands for General Agreement on Tariffs and Trade, established in 1947 and replaced by the WTO on January 1, 1995.",
    expHi: "GATT का पूर्ण रूप 'General Agreement on Tariffs and Trade' है। 1 जनवरी 1995 को इसे विश्व व्यापार संगठन (WTO) द्वारा प्रतिस्थापित किया गया।",
    keyFact: "The Uruguay Round of GATT led directly to the Marrakesh Agreement creating the WTO."
  },
  {
    id: 6,
    visualType: "table",
    visualContent: `

        <div style="font-weight: 700; color: #93c5fd; margin-bottom: 8px;">निर्देश (प्र. सं. 45 से प्र. सं. 49): निम्नलिखित गद्यांश को पढ़कर पूछे गए प्रश्नों के उत्तर दीजिए ।</div>
        <p style="margin-bottom: 8px;">हिंदी साहित्य में ग्रामांचलिकता की प्रवृत्ति स्वातंत्र्योत्तर काल में पनप उठी है। महात्मा गाँधीजी के 'देहात की ओर चलो' इस नारे के अनुकरण पर ग्रामांचलिक साहित्य का आंदोलन शुरू हुआ । ग्रामीण लोगों का प्रबोधन करके उनमें चेतना जगाने का काम ग्रामांचलिक लेखकों ने किया है। वहाँ के जन-जीवन की समस्याओं को लोगों के सामने रखने का उद्देश्य ग्रामांचलिक साहित्यकारों में रहा है।</p>

let currentIndex = 0;
let userAnswers = questionsData.map(q => ({
  id: q.id,
  answered: false,
  selectedOption: null,
  isCorrect: null,
  isSkipped: false,
  isMarked: false,
  visited: false
}));

function initSimulator() {
  userAnswers[0].visited = true;
  buildPalette();
  renderQuestion(0);
  updateScoreUI();
}

function calculateScore() {
  let correctCount = userAnswers.filter(q => q.answered && q.isCorrect === true).length;
  let incorrectCount = userAnswers.filter(q => q.answered && q.isCorrect === false && !q.isSkipped).length;
  let netScore = (correctCount * 1.0) - (incorrectCount * 0.25);
  return {
    correctCount,
    incorrectCount,
    netScore: netScore.toFixed(2)
  };
}

function updateScoreUI() {
  const score = calculateScore();
  document.getElementById('score-counter').textContent = score.netScore;
  document.getElementById('q-counter').textContent = `${currentIndex + 1}/${questionsData.length}`;
}

function renderQuestion(index) {
  currentIndex = index;
  userAnswers[index].visited = true;
  const q = questionsData[index];
  const state = userAnswers[index];

  document.getElementById('q-label').textContent = `Question ${q.id} of ${questionsData.length}`;

  const visualSlot = document.getElementById('visual-slot');
  if (q.visualContent) {
    visualSlot.innerHTML = `<div class="visual-container">${q.visualContent}</div>`;
    visualSlot.style.display = 'block';
  } else {
    visualSlot.innerHTML = '';
    visualSlot.style.display = 'none';
  }

  const stemSlot = document.getElementById('q-stem');
  if (q.isHindiOnly) {
    stemSlot.innerHTML = `<div class="hi">${q.stemHi}</div>`;
  } else {
    stemSlot.innerHTML = `<div>${q.stemEn}</div><div class="hi">${q.stemHi}</div>`;
  }

  const optSlot = document.getElementById('options-slot');
  optSlot.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.disabled = state.answered;

    if (q.isHindiOnly) {
      btn.innerHTML = `<span class="opt-tag">(${opt.tag})</span> <span>${opt.hi}</span>`;
    } else {
      btn.innerHTML = `<span class="opt-tag">(${opt.tag})</span> <span>${opt.en} / ${opt.hi}</span>`;
    }

    if (state.answered) {
      if (opt.tag === q.correct) {
        btn.classList.add('correct');
      } else if (opt.tag === state.selectedOption) {
        btn.classList.add('incorrect');
      }
    }

    btn.onclick = () => selectOption(opt.tag);
    optSlot.appendChild(btn);
  });

  const expSlot = document.getElementById('explanation-slot');
  if (state.answered) {
    expSlot.classList.add('active');
    const expText = document.getElementById('exp-text');
    if (q.isHindiOnly) {
      expText.innerHTML = `<div><b>व्याख्या:</b> ${q.expHi}</div>`;
    } else {
      expText.innerHTML = `<div><b>English:</b> ${q.expEn}</div><div style="margin-top:6px;"><b>व्याख्या:</b> ${q.expHi}</div>`;
    }
    document.getElementById('exp-fact').innerHTML = `<b>Key Exam Fact:</b> ${q.keyFact}`;
  } else {
    expSlot.classList.remove('active');
  }

  document.getElementById('btn-prev').disabled = (index === 0);
  document.getElementById('btn-next').disabled = (index === questionsData.length - 1);

  const markBtn = document.getElementById('btn-mark');
  markBtn.style.background = state.isMarked ? '#8b5cf6' : 'rgba(139, 92, 246, 0.2)';
  markBtn.style.color = state.isMarked ? '#ffffff' : '#c4b5fd';

  updateScoreUI();
  updatePaletteNode(index);
}

function selectOption(tag) {
  const state = userAnswers[currentIndex];
  if (state.answered) return;

  const q = questionsData[currentIndex];
  state.answered = true;
  state.selectedOption = tag;
  state.isCorrect = (tag === q.correct);
  state.isSkipped = false;

  renderQuestion(currentIndex);
}

function skipCurrentQuestion() {
  const state = userAnswers[currentIndex];
  if (!state.answered) {
    state.isSkipped = true;
    updatePaletteNode(currentIndex);
  }
  if (currentIndex < questionsData.length - 1) {
    navigateQuestion(1);
  }
}

function toggleMarkForReview() {
  const state = userAnswers[currentIndex];
  state.isMarked = !state.isMarked;
  renderQuestion(currentIndex);
}

function navigateQuestion(step) {
  const target = currentIndex + step;
  if (target >= 0 && target < questionsData.length) {
    renderQuestion(target);
  }
}

function togglePalette(open) {
  const drawer = document.getElementById('palette-drawer');
  const overlay = document.getElementById('palette-overlay');
  if (open) {
    drawer.classList.add('active');
    overlay.classList.add('active');
  } else {
    drawer.classList.remove('active');
    overlay.classList.remove('active');
  }
}

function buildPalette() {
  const grid = document.getElementById('palette-grid-items');
  grid.innerHTML = '';
  questionsData.forEach((q, i) => {
    const node = document.createElement('div');
    node.className = 'p-node status-unvisited';
    node.id = `palette-node-${i}`;
    node.textContent = q.id;
    node.onclick = () => {
      togglePalette(false);
      renderQuestion(i);
    };
    grid.appendChild(node);
  });
}

function updatePaletteNode(index) {
  const node = document.getElementById(`palette-node-${index}`);
  if (!node) return;

  document.querySelectorAll('.p-node').forEach(n => n.classList.remove('current'));
  node.classList.add('current');

  const s = userAnswers[index];
  node.className = 'p-node current';

  if (s.isMarked) {
    node.classList.add('status-marked');
  } else if (s.answered) {
    if (s.isCorrect) node.classList.add('status-correct');
    else node.classList.add('status-incorrect');
  } else if (s.isSkipped) {
    node.classList.add('status-skipped');
  } else if (s.visited) {
    node.classList.add('status-unanswered');
  } else {
    node.classList.add('status-unvisited');
  }
}

function submitExam() {
  if (!confirm('Are you sure you want to finish the exam and see your performance breakdown?')) return;

  const score = calculateScore();
  const correct = parseInt(score.correctCount);
  const incorrect = parseInt(score.incorrectCount);
  const answeredTotal = correct + incorrect;
  const skipped = userAnswers.filter(q => q.isSkipped && !q.answered).length;
  const marked = userAnswers.filter(q => q.isMarked).length;
  const unvisited = userAnswers.filter(q => !q.visited && !q.answered && !q.isSkipped).length;
  const unanswered = questionsData.length - answeredTotal - skipped - unvisited;
  const accuracy = answeredTotal > 0 ? ((correct / answeredTotal) * 100).toFixed(1) : "0.0";

  document.getElementById('q-view').style.display = 'none';
  const report = document.getElementById('report-view');
  report.style.display = 'block';

  let reviewHTML = '';
  questionsData.forEach((q, i) => {
    const st = userAnswers[i];
    let tagClass = 'color:#9ca3af;';
    let statusText = 'Not Attempted';
    if (st.answered) {
      if (st.isCorrect) { tagClass = 'color:#34d399;'; statusText = 'Correct (+1.00)'; }
      else { tagClass = 'color:#f87171;'; statusText = `Incorrect (-0.25) [Selected: ${st.selectedOption}]`; }
    } else if (st.isSkipped) {
      statusText = 'Skipped';
    }

    reviewHTML += `
      <div style="background:#1a1c22; border:1px solid #2e323b; border-radius:8px; padding:16px; margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <b style="color:#60a5fa;">Q${q.id}. ${q.isHindiOnly ? q.stemHi : q.stemEn}</b>
          <span style="${tagClass} font-weight:700;">${statusText}</span>
        </div>
        <div style="font-size:0.9rem; color:#9ca3af; margin-bottom:6px;">Correct Answer: <b style="color:#34d399;">(${q.correct})</b></div>
        <div style="font-size:0.88rem; color:#d1d5db; line-height:1.5;">${q.expHi}</div>
      </div>`;
  });

  report.innerHTML = `
    <div class="report-card">
      <h2 style="color:#60a5fa; margin-bottom:8px;">UPSSSC PET Performance Report</h2>
      <p style="color:#9ca3af; font-size:0.95rem;">Preliminary Eligibility Test Examination Scorecard</p>
      
      <div class="score-summary-grid">
        <div class="summary-box">
          <div class="val" style="color:#60a5fa;">${score.netScore}</div>
          <div class="lbl">Net Score (100)</div>
        </div>
        <div class="summary-box">
          <div class="val" style="color:#34d399;">${correct}</div>
          <div class="lbl">Correct (+1.0)</div>
        </div>
        <div class="summary-box">
          <div class="val" style="color:#f87171;">${incorrect}</div>
          <div class="lbl">Incorrect (-0.25)</div>
        </div>
        <div class="summary-box">
          <div class="val" style="color:#fbbf24;">${accuracy}%</div>
          <div class="lbl">Accuracy</div>
        </div>
        <div class="summary-box">
          <div class="val" style="color:#c4b5fd;">${marked}</div>
          <div class="lbl">Marked Review</div>
        </div>
        <div class="summary-box">
          <div class="val" style="color:#9ca3af;">${skipped}</div>
          <div class="lbl">Skipped</div>
        </div>
      </div>

      <div style="text-align:center; margin:24px 0;">
        <button class="btn-palette" style="display:inline-flex; margin:0 auto;" onclick="retakeExam()">🔄 Retake Exam</button>
      </div>

      <h3 style="color:#e5e7eb; margin:24px 0 16px;">Comprehensive Question Matrix & Explanations</h3>
      <div>${reviewHTML}</div>
    </div>`;
}

function retakeExam() {
  userAnswers = questionsData.map(q => ({
    id: q.id,
    answered: false,
    selectedOption: null,
    isCorrect: null,
    isSkipped: false,
    isMarked: false,
    visited: false
  }));
  document.getElementById('report-view').style.display = 'none';
  document.getElementById('q-view').style.display = 'block';
  initSimulator();
}

window.onload = initSimulator;
</script>
